# `pg_hba.conf`, and before its password line one role let in on a client
# certificate alone, mapped from the certificate's common name. The server
# asks every client for one (`ssl_ca_file`), and checks it where this file says.
local     all  all                 trust
hostssl   all  nestrs_certificate  all  cert  map=certificate
hostssl   all  all                 all  scram-sha-256
