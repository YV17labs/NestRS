name: nestrs

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/nestrs:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-tls:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestrs}
      POSTGRES_DB: ${POSTGRES_DB:-nestrs}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey, the open-source Redis the framework supports, on the hostname every
  # `redis://` URL of the workspace names.
  redis:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A Valkey speaking TLS alone, presenting the suite's service certificate:
  # nest-rs-redis's e2e runs a queue against it, every connection verified.
  redis-tls:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    command:
      - valkey-server
      - --port
      - "0"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /tls/tls_service.pem
      - --tls-key-file
      - /tls/tls_service.key.pem
      - --tls-ca-cert-file
      - /tls/tls_service_ca.pem
      - --tls-auth-clients
      - "no"
    volumes:
      - ../crates/nest-rs-redis/tests/harness/fixtures:/tls:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "--tls", "--cacert", "/tls/tls_service_ca.pem", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-nestrs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-nestrs}
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres-data:
  # Not Redis's volume: Valkey refuses the dump files Redis 7.4 and later write.
  valkey-data:
  rustfs-data:
