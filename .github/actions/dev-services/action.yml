name: Start the development services
description: >-
  Postgres, Valkey and RustFS as the dev container runs them — its own
  docker-compose.yml, every service on TLS alone — presenting the certificate
  .devcontainer/scripts/issue-certificates.sh issues into the CERTS directory the job names,
  whose authority joins the runner's trust store as the dev container's does — with
  Valkey and RustFS reached by the names the certificate gives them, and RustFS
  holding the bucket the development clients name.

runs:
  using: composite
  steps:
    - name: Issue the certificate
      shell: bash
      run: |
        sudo sh .devcontainer/scripts/issue-certificates.sh "$CERTS"
        sudo install -m 0644 "$CERTS/ca.pem" /usr/local/share/ca-certificates/nestrs-development.crt
        sudo update-ca-certificates
    - name: Start the services
      shell: bash
      run: docker compose -f .devcontainer/compose/base.yml up --detach --wait --no-deps postgres valkey-standalone rustfs
    # The names a committed `.env` reaches Valkey and RustFS by: a URL no job
    # variable overrides, such as a named Redis instance's, keeps its host.
    - name: Name the services
      shell: bash
      run: echo '127.0.0.1 valkey-standalone rustfs' | sudo tee -a /etc/hosts
    # The development profile's storage URL and endpoint, unchanged: a variable
    # set beside the in-process store an app may open instead would refuse its
    # boot.
    - name: Create the bucket
      shell: bash
      run: sh .devcontainer/scripts/create-bucket.sh https://rustfs:9000
