name: Start the topology services
description: >-
  Valkey in the two topologies beside the standalone server — a primary on
  6380 and its replica on 6381 watched as `nestrs` by three sentinels on
  26379-26381, and a six-node cluster on 7000-7005 — on the runner's loopback,
  every node and sentinel on TLS alone, presenting the certificate the
  dev-services action issued into CERTS, in the Valkey image the dev
  container's compose file pins. By hand, on a Docker host with CERTS and
  VALKEY_IMAGE set: run the step's script from this folder.

outputs:
  sentinel-url:
    description: The URL an app reaches the Sentinel deployment's primary through.
    value: rediss-sentinel://127.0.0.1:26379?node=127.0.0.1:26380&node=127.0.0.1:26381&sentinelServiceName=nestrs
  cluster-url:
    description: The URL an app reaches the Cluster through.
    value: rediss-cluster://127.0.0.1:7000?node=127.0.0.1:7001&node=127.0.0.1:7002

runs:
  using: composite
  steps:
    - name: Start the services, form the cluster and wait for the sentinels
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        VALKEY_IMAGE=$(docker compose -f "$GITHUB_WORKSPACE/.devcontainer/docker-compose.yml" config --images | grep '^valkey/')
        export VALKEY_IMAGE
        docker compose up --detach --wait
        valkey() { docker compose exec -T cluster-7000 timeout 60 valkey-cli --tls --cacert /certs/ca.pem "$@"; }
        eventually() {
          for _ in {1..120}; do
            if "$@"; then return 0; fi
            sleep 0.5
          done
          echo "::error::Still false after a minute: $*"
          return 1
        }
        synced() { valkey -p "$1" INFO replication | grep -E '^(role:master|master_link_status:up)' >/dev/null; }
        serving() { valkey -p "$1" CLUSTER INFO | grep '^cluster_state:ok' >/dev/null; }
        primary() { valkey -p "$1" SENTINEL GET-MASTER-ADDR-BY-NAME nestrs | paste -sd: -; }
        agreed() {
          local first
          first=$(primary 26379)
          [ -n "$first" ] && [ "$(primary 26380)" = "$first" ] && [ "$(primary 26381)" = "$first" ]
        }
        watching() {
          valkey -p "$1" SENTINEL MASTER nestrs | awk '
            key == "num-slaves" { replicas = $0 }
            key == "num-other-sentinels" { sentinels = $0 }
            { key = $0 }
            END { exit !(replicas == 1 && sentinels == 2) }'
        }

        if ! valkey -p 7000 CLUSTER INFO | grep '^cluster_slots_assigned:16384' >/dev/null; then
          valkey --cluster create 127.0.0.1:{7000..7005} --cluster-replicas 1 --cluster-yes
        fi
        for port in {7000..7005}; do
          eventually serving "$port"
          eventually synced "$port"
        done

        eventually synced 6380
        eventually synced 6381
        for port in 26379 26380 26381; do
          eventually watching "$port"
        done
        eventually agreed
