# Run by action.yml; by hand, from this folder with CERTS and VALKEY_IMAGE set,
# its step's commands.
name: nestrs-topologies

# The host's network: every node, replica and sentinel announces 127.0.0.1,
# which the certificate names, and the ports clear the dev services'.
x-valkey: &valkey
  # The dev container's own Valkey, which action.yml reads from its compose file.
  image: ${VALKEY_IMAGE:?the Valkey image the dev container's compose file pins}
  network_mode: host
  user: "999:999"
  volumes:
    - ${CERTS:?the directory the dev-services action issued the certificate into}:/certs:ro

# Each service sets PORT, the TLS port it listens on and is checked through.
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 30s
  start_interval: 1s
  test: [CMD-SHELL, 'valkey-cli --tls --cacert /certs/ca.pem -p "$$PORT" ping']

x-node: &node
  <<: *valkey
  configs: [node.conf]
  command: [sh, -c, 'exec valkey-server /node.conf --tls-port "$$PORT"']
  healthcheck: *healthcheck

x-sentinel: &sentinel
  <<: *valkey
  configs: [sentinel.conf]
  command: [sh, -c, 'cat /sentinel.conf > sentinel.conf && exec valkey-sentinel sentinel.conf --tls-port "$$PORT"']
  healthcheck: *healthcheck

x-cluster: &cluster
  <<: *valkey
  configs: [node.conf, cluster.conf]
  command: [sh, -c, 'exec valkey-server /cluster.conf --tls-port "$$PORT"']
  healthcheck: *healthcheck

configs:
  node.conf:
    content: |
      bind 127.0.0.1 -::1
      port 0
      tls-cert-file /certs/redis/server.pem
      tls-key-file /certs/redis/server.key
      tls-ca-cert-file /certs/ca.pem
      tls-auth-clients no
      tls-replication yes
      repl-diskless-sync-delay 0
      enable-debug-command local
      appendonly no
      save ""
  cluster.conf:
    content: |
      include /node.conf
      cluster-enabled yes
      tls-cluster yes
      cluster-databases 16
      cluster-node-timeout 2000
  # Sentinel rewrites its configuration, so each one starts from a copy. The
  # replica is named: a sentinel reading the primary's INFO before the replica
  # connects would otherwise learn of it only at its next INFO, 10 s later.
  sentinel.conf:
    content: |
      bind 127.0.0.1 -::1
      port 0
      tls-cert-file /certs/redis/server.pem
      tls-key-file /certs/redis/server.key
      tls-ca-cert-file /certs/ca.pem
      tls-auth-clients no
      tls-replication yes
      sentinel monitor nestrs 127.0.0.1 6380 2
      sentinel down-after-milliseconds nestrs 2000
      sentinel failover-timeout nestrs 10000
      sentinel known-replica nestrs 127.0.0.1 6381

services:
  monitored-6380: {<<: *node, environment: {PORT: "6380"}}
  monitored-6381:
    <<: *node
    environment: {PORT: "6381"}
    command: [sh, -c, 'exec valkey-server /node.conf --tls-port "$$PORT" --replicaof 127.0.0.1 6380']

  sentinel-26379: {<<: *sentinel, environment: {PORT: "26379"}}
  sentinel-26380: {<<: *sentinel, environment: {PORT: "26380"}}
  sentinel-26381: {<<: *sentinel, environment: {PORT: "26381"}}

  cluster-7000: {<<: *cluster, environment: {PORT: "7000"}}
  cluster-7001: {<<: *cluster, environment: {PORT: "7001"}}
  cluster-7002: {<<: *cluster, environment: {PORT: "7002"}}
  cluster-7003: {<<: *cluster, environment: {PORT: "7003"}}
  cluster-7004: {<<: *cluster, environment: {PORT: "7004"}}
  cluster-7005: {<<: *cluster, environment: {PORT: "7005"}}
