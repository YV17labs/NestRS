# The trees `just audit` reads, watched on the default branch by Dependabot for
# the vulnerabilities GitHub's advisory database holds, its alerts and security
# updates turned on in the repository's settings: no workflow audits a branch
# on a clock. Security updates alone: no version-update pull request may be
# open, so Dependabot opens one only for an advisory a release fixes. The
# benchmarks' trees stay out (.claude/decisions/ci-on-change.md).

version: 2
updates:
  # A security update takes no cooldown, and no version update is opened.
  - package-ecosystem: cargo # zizmor: ignore[dependabot-cooldown]
    directories:
      - /
      - /demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
