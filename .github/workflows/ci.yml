# The gate: every push to `main` or a release branch, and every pull request.
#
# Cheap jobs first. `check`, `supply-chain`, `workflows` and `docs` start at
# once and finish in minutes; everything that builds the test suites waits for
# `check`, so a formatting slip or a clippy finding costs one short job rather
# than a dozen long ones. The backends are real — Postgres, Redis and RustFS as
# service containers, on the images and credentials the devcontainer uses —
# and `backends` runs the Redis adapter's suite against every server line the
# framework supports.
#
# `beta`, `mutants` and `minimal-versions` are advisory: they report, and never
# fail the run.

name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # `.config/nextest.toml`: a CI run reports every failing test, not the first.
  NEXTEST_PROFILE: ci

jobs:
  check:
    name: check (fmt, clippy, rustdoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: check
          workspaces: |
            . -> target
            demo -> target
      - name: rustfmt (framework)
        run: cargo fmt --all --check
      - name: rustfmt (demo)
        run: cargo fmt --all --check
        working-directory: demo
      - name: clippy (framework)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (demo)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: demo
      # Every feature, as docs.rs renders each crate (`[package.metadata.docs.rs]`).
      - name: rustdoc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: supply chain (cargo-deny, cargo-machete)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20,cargo-machete@0.9
      # One policy, `deny.toml`, over every lockfile the repo owns.
      - name: cargo-deny (framework)
        run: cargo deny --manifest-path Cargo.toml check
      - name: cargo-deny (demo)
        run: cargo deny --manifest-path demo/Cargo.toml check
      # The SUT's tree is a subset of the framework's, so an ignore or a
      # license the other two need is expected to go unmatched here.
      - name: cargo-deny (benchmark SUT)
        run: cargo deny --manifest-path bench/sut/nestrs/Cargo.toml check --allow advisory-not-detected --allow license-not-encountered
      - name: cargo-machete
        run: cargo machete

  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30
      # Pinned by checksum, as the actions are by commit.
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: docs (lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The lint runs `nest-rs-conformance`'s `canon` binary for the facts it
      # checks pages against.
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: docs
      - run: npm ci
        working-directory: docs
      - run: npm run lint:docs
        working-directory: docs
      - run: npm test
        working-directory: docs

  test:
    name: test (unit, integration, doctests, ACME prefix)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9
      # Includes every trybuild snapshot: the toolchain is pinned, so a
      # diagnostic changes only with a deliberate bump.
      - name: unit and integration
        run: cargo nextest run --workspace -E '!binary(e2e)'
      - name: doctests
        run: cargo test --workspace --doc
      # Every framework variable name is built from the prefix, never spelled:
      # the same suite passes when the deployment renames all of them.
      - name: unit and integration under another prefix
        run: cargo nextest run --workspace -E '!binary(e2e)'
        env:
          NESTRS_ENV_PREFIX: ACME

  e2e:
    name: e2e (Postgres, Redis, S3)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services: &backends
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: nestrs
          POSTGRES_PASSWORD: nestrs
          POSTGRES_DB: nestrs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nestrs -d nestrs"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.6.3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.8
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: nestrs
          RUSTFS_SECRET_KEY: nestrs
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    # The devcontainer's hostnames, as the runner reaches the service ports.
    env:
      NESTRS_SEAORM__URL: postgres://nestrs:nestrs@localhost:5432/nestrs
      NESTRS_REDIS__URL: redis://localhost:6379
      NESTRS_STORAGE__ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9
      - name: e2e
        run: cargo nextest run --workspace -E 'binary(e2e)'

  backends:
    name: backends (${{ matrix.server }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: Redis 6.2, image: 'redis:6.2.20', cli: redis-cli }
          - { server: Redis 7.0, image: 'redis:7.0.15', cli: redis-cli }
          - { server: Redis 8.6, image: 'redis:8.6.3', cli: redis-cli }
          - { server: Valkey 7.2, image: 'valkey/valkey:7.2.11', cli: valkey-cli }
          - { server: Valkey 8.1, image: 'valkey/valkey:8.1.4', cli: valkey-cli }
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NESTRS_REDIS__URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: backends
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9
      - name: nest-rs-redis e2e
        run: cargo nextest run -p nest-rs-redis -E 'binary(e2e)'

  features:
    name: features (each crate alone, each feature alone)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: features
      - run: scripts/check-features.sh

  # Advisory until the owner settles how a floor is written: resolving each
  # direct requirement to its lowest release fails today on requirements that
  # need a patch-level floor (`serde = "1.0"` resolves 1.0.0, which
  # `jsonwebtoken` refuses), and the `major.minor` rule cannot express one.
  minimal-versions:
    name: minimal versions (advisory)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: minimal-versions
      - name: Install nightly (for -Z direct-minimal-versions)
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack@0.6,cargo-minimal-versions@0.1
      # Each requirement the framework declares at the lowest release it
      # admits (dependencies of dependencies at their newest), dev-dependencies
      # removed as on crates.io, then build.
      - run: cargo minimal-versions check --workspace --all-features --direct

  demo:
    name: demo (lint, unit, e2e)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services: *backends
    env:
      # The CLI's own variable: CI installs the tools it would bootstrap.
      NESTRS_NO_BOOTSTRAP: '1'
      NESTRS_SEAORM__URL: postgres://nestrs:nestrs@localhost:5432/nestrs
      # The demo's suites enqueue on Redis database 1, as `.env.test` says.
      NESTRS_REDIS__URL: redis://localhost:6379/1
      NESTRS_STORAGE__ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: demo
          workspaces: |
            . -> target
            demo -> target
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1,cargo-nextest@0.9
      # A debug build: the CLI only drives `just`, and the release profile's
      # fat LTO would cost minutes for nothing.
      - name: Install the CLI from this tree
        run: cargo install --locked --debug --path crates/nest-rs-cli
      - run: nestrs run lint
        working-directory: demo
      - run: nestrs run test unit
        working-directory: demo
      - run: nestrs run test e2e
        working-directory: demo

  beta:
    name: clippy on beta (advisory)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: beta
      - name: Install beta
        run: rustup toolchain install beta --profile minimal --component clippy
      - run: cargo +beta clippy --workspace --all-targets -- -D warnings

  mutants:
    name: mutants on the diff (advisory)
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: mutants
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27,cargo-nextest@0.9
      - name: Diff against the base branch
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      # A surviving mutant is a changed line no test asserts. The e2e suites
      # need backends this job does not start.
      - run: cargo mutants --in-place --in-diff pr.diff --test-tool nextest --no-shuffle -- -E '!binary(e2e)'
