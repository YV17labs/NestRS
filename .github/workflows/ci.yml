name: CI

on:
  push:
    branches: [main, 'release/**']
    paths: &tree
      - '**'
      - '!docs/**'
      - '!demo/**'
      - '!bench/**'
      - '!**.md'
      # Read by a build or a test all the same: a file under a crate's `src/`
      # (the CLI compiles its rules template in), and the pages whose ACL rules
      # and commands nest-rs-redis's e2e runs as printed.
      - 'crates/**/src/**'
      - 'docs/src/content/docs/**'
  pull_request:
    paths: *tree
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, rustdoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: lint
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1,cargo-hack@0.6,cargo-deny@0.20,zizmor@1.30
      # install-action does not carry actionlint: the release is fetched by
      # version and checked against its digest. shellcheck is the runner's.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just lint
      - run: just doc

  test:
    name: test (Postgres, Redis, S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: nestrs
          POSTGRES_PASSWORD: nestrs
          POSTGRES_DB: nestrs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nestrs -d nestrs"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.6.3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.8
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: nestrs
          RUSTFS_SECRET_KEY: nestrs
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    # The dev container's services, as the runner reaches them.
    env:
      NESTRS_SEAORM__URL: postgres://nestrs:nestrs@localhost:5432/nestrs
      NESTRS_REDIS__URL: redis://localhost:6379
      NESTRS_STORAGE__ENDPOINT: http://localhost:9000
      NESTRS_E2E__REDIS_TLS_URL: rediss://localhost:6380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Redis speaking TLS alone, presenting the suite's service certificate:
      # started after the checkout, since a service container cannot mount it.
      - name: Start the TLS Redis
        run: |
          docker run -d --name redis-tls -p 6380:6380 \
            -v "$PWD/crates/nest-rs-redis/tests/harness/fixtures:/tls:ro" \
            redis:8.6.3 redis-server --port 0 --tls-port 6380 \
            --tls-cert-file /tls/tls_service.pem --tls-key-file /tls/tls_service.key.pem \
            --tls-ca-cert-file /tls/tls_service_ca.pem --tls-auth-clients no
          for _ in $(seq 30); do
            docker exec redis-tls redis-cli --tls --cacert /tls/tls_service_ca.pem -p 6380 ping && exit 0
            sleep 1
          done
          exit 1
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9,just@1
      - run: just test

  # The oldest Redis and Valkey the docs claim, each a service of its own:
  # nest-rs-redis's suites pass on both, or the claim moves (queue.md).
  redis:
    name: redis (${{ matrix.server.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server:
          - { name: Redis 6.2, image: 'redis:6.2.24', bin: redis }
          - { name: Valkey 9.1, image: 'valkey/valkey:9.1.2', bin: valkey }
    services:
      redis:
        image: ${{ matrix.server.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "${{ matrix.server.bin }}-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NESTRS_REDIS__URL: redis://localhost:6379
      NESTRS_E2E__REDIS_TLS_URL: rediss://localhost:6380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the TLS server
        env:
          IMAGE: ${{ matrix.server.image }}
          BIN: ${{ matrix.server.bin }}
        run: |
          docker run -d --name redis-tls -p 6380:6380 \
            -v "$PWD/crates/nest-rs-redis/tests/harness/fixtures:/tls:ro" \
            "$IMAGE" "$BIN-server" --port 0 --tls-port 6380 \
            --tls-cert-file /tls/tls_service.pem --tls-key-file /tls/tls_service.key.pem \
            --tls-ca-cert-file /tls/tls_service_ca.pem --tls-auth-clients no
          for _ in $(seq 30); do
            docker exec redis-tls "$BIN-cli" --tls --cacert /tls/tls_service_ca.pem -p 6380 ping && exit 0
            sleep 1
          done
          exit 1
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: redis
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9,just@1
      - run: just test redis
