# Build docs/ (Astro + Starlight) and publish to GitHub Pages on every push to main.
# Repo settings: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# The paths are the lint's whole input set: the pages, plus what the canon is
# derived from and the demo sources and READMEs the lint reads directly — so a
# framework change that falsifies a page fails here, on the commit that caused it.

name: Docs — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'demo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      # The lint runs `nest-rs-conformance`'s `canon` binary for the framework
      # facts it checks pages against. It builds syn and toml_edit, not the
      # framework, so a cold cache costs seconds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'

      - name: Cache the canon build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docs-canon-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Lint docs prose & structure
        run: npm run lint:docs
        working-directory: docs

      - name: Build site
        env:
          ASTRO_SITE: https://nestrs.dev
          ASTRO_BASE: /
        run: npm run build
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
