# The docs site's lint: on a change to the pages, and on a change to what they
# quote — the framework's facts (through `nest-rs-conformance`'s `canon`
# binary) and the demo's sources.

name: Docs

on:
  push:
    branches: [main, 'release/**']
    paths: &quoted
      - 'docs/**'
      - 'crates/**'
      - 'demo/**'
      - '**/README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup-rust/**'
  pull_request:
    paths: *quoted
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: docs (lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The lint runs `nest-rs-conformance`'s `canon` binary for the facts it
      # checks pages against.
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: docs
      - run: npm ci
        working-directory: docs
      - run: npm run lint:docs
        working-directory: docs
      - run: npm test
        working-directory: docs
