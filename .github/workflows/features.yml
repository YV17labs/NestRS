# Every framework crate under its default features, none, and each feature
# alone (`scripts/check-features.sh`) — only when a change can move what a
# feature pulls in: a manifest, the lockfile, the umbrella, the hygiene witness.

name: Features

on:
  push:
    branches: [main, 'release/**']
    paths: &reach
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/nest-rs/**'
      - 'crates/nest-rs-macro-hygiene/**'
      - 'scripts/check-features.sh'
      - '.github/workflows/features.yml'
      - '.github/actions/setup-rust/**'
  pull_request:
    paths: *reach
  workflow_dispatch:

permissions: {}

concurrency:
  group: features-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  features:
    name: features (each crate alone, each feature alone)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: features
      - run: scripts/check-features.sh

  # Advisory until the owner settles how a floor is written: resolving each
  # direct requirement to its lowest release fails today on requirements that
  # need a patch-level floor (`serde = "1.0"` resolves 1.0.0, which
  # `jsonwebtoken` refuses), and the `major.minor` rule cannot express one.
