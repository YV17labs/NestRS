# Publishes every nest-rs-* crate when a v*.*.* tag is pushed. cargo-workspaces
# skips versions already on crates.io, so a re-run resumes an interrupted release
# (cargo publish --workspace cannot: rust-lang/cargo#15006).
# Secret: CARGO_REGISTRY_TOKEN on the `crates-io` environment.

name: Publish — crates.io

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Install mold linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mold

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ws_version=$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          echo "tag=$tag  ws_version=$ws_version"
          if [ "$tag" != "$ws_version" ]; then
            echo "::error::Tag v$tag does not match workspace version $ws_version in Cargo.toml"
            exit 1
          fi

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1,cargo-deny@0.20

      # A release never ships a tree with a known advisory, whatever the last
      # audit run said.
      - name: Audit the tree
        run: just audit

      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --version 0.4.2 --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} # zizmor: ignore[use-trusted-publishing]
        # Retried: a crate that times out on index confirmation is resumed, not lost.
        run: |
          for attempt in 1 2 3; do
            echo "::group::publish attempt $attempt"
            if cargo workspaces publish \
                 --from-git \
                 --publish-interval 15 \
                 --allow-branch '*' \
                 --no-verify \
                 --yes; then
              echo "::endgroup::"
              echo "publish completed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt did not finish (likely a single index-confirmation timeout) — resuming in 30s"
            sleep 30
          done
          echo "::error::publish still incomplete after 3 attempts"
          exit 1
