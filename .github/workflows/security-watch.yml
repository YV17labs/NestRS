# Scheduled watch — a monitor, never a gate.
#
# `ci.yml` is the gate: every push and pull request runs cargo-deny, and its
# nightly run adds the feature matrix and a beta clippy. What a gate cannot do
# is notice the world changing
# while nobody touches the repo: RUSTSEC-2026-0285 (rustls) was published on
# 2026-09-14 and sat in all three lockfiles for eleven days. This workflow is
# the part that notices.
#
# Two watches, one signal:
#   * `advisories` — cargo-deny's advisory check over every lockfile the repo
#     owns (the framework's, the demo's, the benchmark SUT's), against the
#     policy in `deny.toml`: a vulnerability, an unmaintained or unsound crate,
#     or a yanked release fails it unless `deny.toml` argues it away.
#   * `future-incompat` — the framework built on the Rust *beta* toolchain.
#     apalis-redis 0.7.4 carries a never-type-fallback lint that rustc says will
#     become a hard error "in a future release in all editions"; beta runs six
#     weeks ahead of stable, so a failure here is the notice before the break.
#
# A failure opens one issue, or comments on it while it stays open, so the
# signal outlives the Actions tab. `GITHUB_TOKEN` is scoped to that one write.

name: Security — advisory watch

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-watch
  cancel-in-progress: false

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph through `cargo metadata`.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20

      - name: Check every lockfile the repo owns
        run: |
          status=0
          for manifest in Cargo.toml demo/Cargo.toml bench/sut/nestrs/Cargo.toml; do
            echo "::group::$manifest"
            if cargo deny --manifest-path "$manifest" check advisories; then
              echo "- \`$manifest\`: clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$manifest\`: **advisories found**" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  future-incompat:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: beta

      - name: Install Rust beta toolchain
        run: rustup toolchain install beta --profile minimal

      # The toolchain file pins the stable floor for local work and CI; this
      # job is the one place that deliberately builds ahead of it.
      - name: Build the framework on beta
        run: cargo +beta check --workspace --all-targets

      - name: Report future incompatibilities
        run: cargo +beta report future-incompatibilities || echo "no future-incompatibility report"

  report:
    needs: [advisories, future-incompat]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the watch issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADVISORIES: ${{ needs.advisories.result }}
          FUTURE_INCOMPAT: ${{ needs.future-incompat.result }}
        with:
          script: |
            const title = 'Security watch: a scheduled check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Run: ${run}`,
              '',
              `- advisories (three lockfiles): **${process.env.ADVISORIES}**`,
              `- beta build (future-incompat lints): **${process.env.FUTURE_INCOMPAT}**`,
              '',
              'An advisories failure means a lockfile resolves a crate with an advisory, or a yanked release, that `deny.toml` does not argue away: update the crate, or add an ignore with the reason it is unreachable. A beta failure means the next stable will not build the framework.',
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
