[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "7.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/YV17labs/NestRS"
homepage = "https://nestrs.dev"

[workspace.dependencies]
# poem, sea-orm, async-graphql, rmcp, inventory, validator and schemars appear
# in the code the macros emit: their majors move only with a nestrs major.
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"

thiserror = "2.0"
anyhow = "1.0"

jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
# Past the 12-month bar: 5.0.0 (2025-01-21) is the last release. Only RFC 6749's
# types and flow are its; the HTTP client is the workspace's. No release by
# 2027-01-31 and the exchange is written on reqwest instead.
oauth2 = { version = "5.0", default-features = false }
base64 = "0.23"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

figment = { version = "0.10", features = ["toml", "env"] }

# Past the 12-month bar: 3.1.12 (2025-07-28) is the last release. 4.0, prepared
# upstream (poem-web/poem#1200), drops the unmaintained rustls-pemfile; it moves
# at its release, in a nestrs major since poem's types are in the API. No release
# by 2027-01-31 and the server moves (`.claude/decisions/http-server.md`).
poem = { version = "3.1", features = ["tower-compat", "anyhow", "rustls", "compression", "multipart", "sse"] }
rustls = "0.23"

object_store = { version = "0.14", features = ["aws"] }
http = "1.5"

http-body = "1.1"
http-body-util = "0.1"

bytes = "1.12"
futures-util = "0.3"

tokio-tungstenite = "0.30"

async-trait = "0.1"

parking_lot = "0.12"

subtle = "2.6"

# Exact pin: nest-rs-graphql reads async-graphql's registry internals.
# Without its defaults: the framework serves the playground and builds dataloaders,
# and an email check is `validator`'s, the one validation at the edge.
async-graphql = { version = "=7.2.1", default-features = false, features = ["dataloader", "playground"] }
async-graphql-poem = "=7.2.1"
inventory = "0.3"

argon2 = "0.6"
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }

sea-orm = { version = "=2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio", "macros", "with-uuid"] }
sea-orm-migration = { version = "=2.0", features = ["sqlx-postgres", "runtime-tokio"] }
# Postgres's TLS on aws-lc-rs, the provider every other client uses: sea-orm's
# `runtime-tokio-rustls` can only select sqlx's ring backend, and sqlx picks ring
# whenever any ring feature is on.
sqlx = { version = "0.9", default-features = false, features = ["tls-rustls-aws-lc-rs"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

trybuild = "1.0"

flate2 = "1.1"

rmcp = { version = "3.4", features = ["server", "macros", "elicitation", "transport-streamable-http-server"] }
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }

croner = "4.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"

redis = { version = "1.7", default-features = false, features = [
    "aio",
    "connection-manager",
    "script",
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }

clap = { version = "4.6", features = ["derive", "env"] }
toml_edit = "0.25"

syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"

tempfile = "3.27"
tokio-rustls = "0.26"
libc = "0.2"

# `=`: macro expansions call #[doc(hidden)] items semver does not cover.
nest-rs-core = { version = "=7.0.0", path = "crates/nest-rs-core" }
nest-rs-authn = { version = "=7.0.0", path = "crates/nest-rs-authn" }
nest-rs-throttler = { version = "=7.0.0", path = "crates/nest-rs-throttler" }
nest-rs-config = { version = "=7.0.0", path = "crates/nest-rs-config" }
nest-rs-config-macros = { version = "=7.0.0", path = "crates/nest-rs-config-macros" }
nest-rs-events = { version = "=7.0.0", path = "crates/nest-rs-events" }
nest-rs-events-macros = { version = "=7.0.0", path = "crates/nest-rs-events-macros" }
nest-rs-authz = { version = "=7.0.0", path = "crates/nest-rs-authz" }
nest-rs-codegen = { version = "=7.0.0", path = "crates/nest-rs-codegen" }
nest-rs-core-macros = { version = "=7.0.0", path = "crates/nest-rs-core-macros" }
nest-rs-graphql = { version = "=7.0.0", path = "crates/nest-rs-graphql" }
nest-rs-graphql-macros = { version = "=7.0.0", path = "crates/nest-rs-graphql-macros" }
nest-rs-guards = { version = "=7.0.0", path = "crates/nest-rs-guards" }
nest-rs-health = { version = "=7.0.0", path = "crates/nest-rs-health" }
nest-rs-health-macros = { version = "=7.0.0", path = "crates/nest-rs-health-macros" }
nest-rs-http = { version = "=7.0.0", path = "crates/nest-rs-http" }
nest-rs-http-macros = { version = "=7.0.0", path = "crates/nest-rs-http-macros" }
nest-rs-mcp = { version = "=7.0.0", path = "crates/nest-rs-mcp" }
nest-rs-mcp-macros = { version = "=7.0.0", path = "crates/nest-rs-mcp-macros" }
nest-rs-interceptors = { version = "=7.0.0", path = "crates/nest-rs-interceptors" }
nest-rs-filters = { version = "=7.0.0", path = "crates/nest-rs-filters" }
nest-rs-exception-filters = { version = "=7.0.0", path = "crates/nest-rs-exception-filters" }
nest-rs-openapi = { version = "=7.0.0", path = "crates/nest-rs-openapi" }
nest-rs-database = { version = "=7.0.0", path = "crates/nest-rs-database" }
nest-rs-seaorm = { version = "=7.0.0", path = "crates/nest-rs-seaorm" }
nest-rs-pipes = { version = "=7.0.0", path = "crates/nest-rs-pipes" }
nest-rs-queue = { version = "=7.0.0", path = "crates/nest-rs-queue" }
nest-rs-queue-macros = { version = "=7.0.0", path = "crates/nest-rs-queue-macros" }
nest-rs-redis = { version = "=7.0.0", path = "crates/nest-rs-redis" }
nest-rs-resource = { version = "=7.0.0", path = "crates/nest-rs-resource" }
nest-rs-resource-macros = { version = "=7.0.0", path = "crates/nest-rs-resource-macros" }
nest-rs-schedule = { version = "=7.0.0", path = "crates/nest-rs-schedule" }
nest-rs-schedule-macros = { version = "=7.0.0", path = "crates/nest-rs-schedule-macros" }
nest-rs-server-timing = { version = "=7.0.0", path = "crates/nest-rs-server-timing" }
nest-rs-oauth-client = { version = "=7.0.0", path = "crates/nest-rs-oauth-client" }
nest-rs-oauth-server = { version = "=7.0.0", path = "crates/nest-rs-oauth-server" }
nest-rs-oauth-resource = { version = "=7.0.0", path = "crates/nest-rs-oauth-resource" }
nest-rs-social = { version = "=7.0.0", path = "crates/nest-rs-social" }
nest-rs-opentelemetry = { version = "=7.0.0", path = "crates/nest-rs-opentelemetry" }
nest-rs-testing = { version = "=7.0.0", path = "crates/nest-rs-testing" }
nest-rs-storage = { version = "=7.0.0", path = "crates/nest-rs-storage" }
nest-rs-worker = { version = "=7.0.0", path = "crates/nest-rs-worker" }
nest-rs-ws = { version = "=7.0.0", path = "crates/nest-rs-ws" }
nest-rs-ws-macros = { version = "=7.0.0", path = "crates/nest-rs-ws-macros" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
needless_update = "allow"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
self_named_module_files = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
