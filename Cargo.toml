[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "7.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/YV17labs/NestRS"
homepage = "https://nestrs.dev"

[workspace.dependencies]
# `public`: a public dependency, whose types reach the public API, so its major
# (a 0.x's minor) moves only with a nestrs major; every other library is private
# and wrapped (.claude/decisions/public-dependencies.md).
tokio = { version = "1.53", features = ["full"] }  # public
tokio-util = { version = "0.7", features = ["rt", "io"] }  # public

tracing = "0.1"  # public
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = "0.33"
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"

thiserror = "2.0"
anyhow = "1.0"  # public

jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
# Past the 12-month bar (5.0.0, 2025-01-21): no release by 2027-01-31 and the
# exchange is written on reqwest instead.
oauth2 = { version = "5.0", default-features = false }
base64 = "0.23"

serde = { version = "1.0", features = ["derive"] }  # public
serde_json = "1.0"  # public

# Past the 12-month bar (0.10.19, 2024-05-17), and test-only (`Jail`): no
# release by 2027-01-31 and the suites stop mutating the process environment.
figment = "0.10"

# Past the 12-month bar (3.1.12, 2025-07-28): 4.0 (poem-web/poem#1200) at its
# release, or none by 2027-01-31 and `.claude/decisions/http-server.md` applies.
poem = { version = "3.1", features = ["tower-compat", "anyhow", "compression", "multipart"] }
rustls = "0.23"  # public in nest-rs-testing alone
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }

object_store = { version = "0.14", features = ["aws"] }
http = "1.5"  # public

http-body = "1.1"  # public
http-body-util = "0.1"
headers = "0.4"
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
h2 = "0.4"

bytes = "1.12"  # public
futures-util = "0.3"  # public
pin-project-lite = "0.2"

# No default feature: the server half needs only the handshake's accept key;
# a client (`connect`) is enabled where one is driven.
tokio-tungstenite = { version = "0.30", default-features = false }

async-trait = "0.1"  # public

# Past the 12-month bar (0.12.5, 2025-10-03): std's non-poisoning locks
# (rust-lang/rust#134645) at their stabilisation, or no release by 2027-04-03 and
# `std::sync` takes its place under one poisoning policy.
parking_lot = "0.12"

# Public. `=`: nest-rs-graphql reads async-graphql's registry internals.
# `custom-error-conversion` removes the blanket `From<T: Display>` into its
# error: a `?` in a resolver body would otherwise ship a foreign error's
# sentence before the wrapper could answer it opaquely.
async-graphql = { version = "=7.2.1", default-features = false, features = ["custom-error-conversion", "dataloader", "playground"] }
inventory = "0.3"  # public

argon2 = "0.6"
getrandom = "0.4"
validator = { version = "0.21", features = ["derive"] }  # public
uuid = { version = "1.27", features = ["v4", "v7", "serde"] }  # public
url = "2.5"

# Public. `=`: sea-orm's types are `Repo`'s API, so even a minor is a reviewed
# bump, both pins together.
sea-orm = { version = "=2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio", "macros", "with-uuid"] }
sea-orm-migration = { version = "=2.0", features = ["sqlx-postgres", "runtime-tokio"] }
# Named for its feature alone: sea-orm's `runtime-tokio-rustls` selects sqlx's
# ring backend, which deny.toml bans.
sqlx = { version = "0.9", default-features = false, features = ["tls-rustls-aws-lc-rs"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

trybuild = "1.0"

flate2 = "1.1"

rmcp = { version = "3.5", features = ["server", "macros", "elicitation", "transport-streamable-http-server"] }  # public
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }  # public

croner = { version = "4.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }  # public
jiff = { version = "0.2", default-features = false, features = ["std", "tz-fat"] }
# The one zone database: `#[cron(tz)]` is checked against it and the scheduler
# reads it, never the host's zoneinfo, so the two cannot disagree.
jiff-tzdb = "0.1"

# Public. `=`: nest-rs-redis opens each Cluster node through
# `ClusterClient::get_async_generic_connection`, which is `#[doc(hidden)]`.
# `cluster-async` brings crc16 0.4 (2018), the slot checksum, finished and
# without an advisory; it leaves with `redis`.
redis = { version = "=1.7", default-features = false, features = [
    "aio",
    "cluster-async",
    "connection-manager",
    "script",
    "tokio-comp",
    "tokio-rustls-comp",
    # Never read, the framework hands each client its roots; without it, `redis`
    # reloads the system's store on every connection.
    "tls-rustls-webpki-roots",
] }

clap = { version = "4.6", features = ["derive", "env"] }
toml_edit = "0.25"

syn = { version = "3.0", features = ["full"] }  # public
quote = "1.0"
proc-macro2 = "1.0"  # public
proc-macro-crate = "3.5"
# sea-orm-macros derives an entity's `Column` variants with heck, so `#[expose]`
# names them with it too. 0.5.0 (2024-03) crosses the freshness bar: finished,
# without an advisory, and it moves when sea-orm-macros moves.
heck = "0.5"

tempfile = "3.27"
tokio-rustls = "0.26"  # public in nest-rs-testing alone
libc = "0.2"
# The micro-benchmarks' harness (`nest-rs-core`'s `benches/`): warm-up,
# sampling and outlier analysis; the plots and the thread pool they pull are off.
criterion = { version = "0.8", default-features = false }

# The embedded source of `nest-rs-static-files`: a folder compiled into the
# binary. `debug-embed` embeds in a debug build too, so what a test serves is
# what a release serves, and the mode reading the folder at runtime never runs.
rust-embed = { version = "8.13", features = ["debug-embed"] }  # public

# `=`: macro expansions and sibling crates call `__private`, which semver does
# not cover.
nest-rs-core = { version = "=7.0.0", path = "crates/nest-rs-core" }
nest-rs-authn = { version = "=7.0.0", path = "crates/nest-rs-authn" }
nest-rs-throttler = { version = "=7.0.0", path = "crates/nest-rs-throttler" }
nest-rs-config = { version = "=7.0.0", path = "crates/nest-rs-config" }
nest-rs-config-macros = { version = "=7.0.0", path = "crates/nest-rs-config-macros" }
nest-rs-events = { version = "=7.0.0", path = "crates/nest-rs-events" }
nest-rs-events-macros = { version = "=7.0.0", path = "crates/nest-rs-events-macros" }
nest-rs-authz = { version = "=7.0.0", path = "crates/nest-rs-authz" }
nest-rs-codegen = { version = "=7.0.0", path = "crates/nest-rs-codegen" }
nest-rs-core-macros = { version = "=7.0.0", path = "crates/nest-rs-core-macros" }
nest-rs-graphql = { version = "=7.0.0", path = "crates/nest-rs-graphql" }
nest-rs-graphql-macros = { version = "=7.0.0", path = "crates/nest-rs-graphql-macros" }
nest-rs-guards = { version = "=7.0.0", path = "crates/nest-rs-guards" }
nest-rs-health = { version = "=7.0.0", path = "crates/nest-rs-health" }
nest-rs-health-macros = { version = "=7.0.0", path = "crates/nest-rs-health-macros" }
nest-rs-http = { version = "=7.0.0", path = "crates/nest-rs-http" }
nest-rs-http-macros = { version = "=7.0.0", path = "crates/nest-rs-http-macros" }
nest-rs-mcp = { version = "=7.0.0", path = "crates/nest-rs-mcp" }
nest-rs-mcp-macros = { version = "=7.0.0", path = "crates/nest-rs-mcp-macros" }
nest-rs-interceptors = { version = "=7.0.0", path = "crates/nest-rs-interceptors" }
nest-rs-filters = { version = "=7.0.0", path = "crates/nest-rs-filters" }
nest-rs-exception-filters = { version = "=7.0.0", path = "crates/nest-rs-exception-filters" }
nest-rs-openapi = { version = "=7.0.0", path = "crates/nest-rs-openapi" }
nest-rs-database = { version = "=7.0.0", path = "crates/nest-rs-database" }
nest-rs-seaorm = { version = "=7.0.0", path = "crates/nest-rs-seaorm" }
nest-rs-seaorm-macros = { version = "=7.0.0", path = "crates/nest-rs-seaorm-macros" }
nest-rs-pipes = { version = "=7.0.0", path = "crates/nest-rs-pipes" }
nest-rs-queue = { version = "=7.0.0", path = "crates/nest-rs-queue" }
nest-rs-queue-macros = { version = "=7.0.0", path = "crates/nest-rs-queue-macros" }
nest-rs-redis = { version = "=7.0.0", path = "crates/nest-rs-redis" }
nest-rs-schedule = { version = "=7.0.0", path = "crates/nest-rs-schedule" }
nest-rs-schedule-macros = { version = "=7.0.0", path = "crates/nest-rs-schedule-macros" }
nest-rs-server-timing = { version = "=7.0.0", path = "crates/nest-rs-server-timing" }
nest-rs-oauth-client = { version = "=7.0.0", path = "crates/nest-rs-oauth-client" }
nest-rs-oauth-server = { version = "=7.0.0", path = "crates/nest-rs-oauth-server" }
nest-rs-oauth-resource = { version = "=7.0.0", path = "crates/nest-rs-oauth-resource" }
nest-rs-social = { version = "=7.0.0", path = "crates/nest-rs-social" }
nest-rs-opentelemetry = { version = "=7.0.0", path = "crates/nest-rs-opentelemetry" }
nest-rs-testing = { version = "=7.0.0", path = "crates/nest-rs-testing" }
nest-rs-storage = { version = "=7.0.0", path = "crates/nest-rs-storage" }
nest-rs-static-files = { version = "=7.0.0", path = "crates/nest-rs-static-files" }
nest-rs-ws = { version = "=7.0.0", path = "crates/nest-rs-ws" }
nest-rs-ws-macros = { version = "=7.0.0", path = "crates/nest-rs-ws-macros" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
needless_update = "allow"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
self_named_module_files = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
