<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="NestRS — The Rust framework for modular, scalable backends">
<defs>
  <linearGradient id="rs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff4d5f"/>
    <stop offset="100%" stop-color="#ff7a59"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff6e5a" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#ff6e5a" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1280" height="640" fill="#121114"/>
<circle cx="250" cy="180" r="520" fill="url(#glow)"/>
<rect x="0" y="0" width="1280" height="1" fill="#26242a"/>

<!-- Lockup -->
<g transform="translate(66,150) scale(1.5)">
<text x="100" y="40" text-anchor="end" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.38" fill="#e8e4dc">Nest</text>
<text x="100" y="40" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="800" font-style="italic" letter-spacing="-1.17" fill="url(#rs-grad)">RS</text>
<g transform="translate(126.0,54.2)"><rect x="-22.0" y="-2.5" width="44.0" height="5.0" rx="2.5" fill="url(#rs-grad)" transform="skewX(-18)"/></g>
<g transform="translate(160.0,54.2)"><rect x="-6.0" y="-2.5" width="12.0" height="5.0" rx="2.5" fill="#ff7a59" opacity="0.45" transform="skewX(-18)"/></g>
</g>

<!-- Claim -->
<text x="96" y="330"
      font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="66" font-weight="800" letter-spacing="-2.4" fill="#e8e4dc">The Rust framework for</text>
<text x="96" y="404"
      font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="66" font-weight="800" letter-spacing="-2.4"><tspan fill="#ff6e5a">modular, scalable</tspan><tspan fill="#e8e4dc" dx="16">backends.</tspan></text>

<text x="96" y="466"
      font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="27" font-weight="400" fill="#a39e94">You write the business logic; NestRS carries the rest — verified at boot.</text>

<!-- Stat strip -->
<rect x="96" y="520" width="1088" height="1" fill="#26242a"/>
<g font-family="'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <text x="96"  y="574" font-size="34" font-weight="700" fill="#ff6e5a">×4.2</text>
  <text x="368" y="574" font-size="34" font-weight="700" fill="#ff6e5a">×25</text>
  <text x="640" y="574" font-size="34" font-weight="700" fill="#ff6e5a">×23</text>
  <text x="912" y="574" font-size="34" font-weight="700" fill="#ff6e5a">0</text>
</g>
<g font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#a39e94">
  <text x="96"  y="604">throughput</text>
  <text x="368" y="604">less memory</text>
  <text x="640" y="604">faster cold start</text>
  <text x="912" y="604">unguarded routes</text>
</g>
</svg>
