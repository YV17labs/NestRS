[package]
name = "queue-bench"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[dependencies]
# The install a headless worker takes: no HTTP stack. Only the public surface
# (`nest_rs::queue`, `nest_rs::redis`) is named, so the same source measures any
# Redis adapter that keeps it.
nest-rs = { path = "../../crates/nest-rs", default-features = false, features = ["redis", "queue"] }
anyhow = "1.0"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "process", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
