allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

disallowed-methods = [
    { path = "std::env::var", reason = "read configuration through a #[config] or ConfigService, so the env prefix and the .env cascade apply" },
    { path = "std::env::var_os", reason = "read configuration through a #[config] or ConfigService, so the env prefix and the .env cascade apply" },
    { path = "redis::Script::invoke_async", reason = "run a script through RedisConnection::invoke: it loads the script again on the node that forgot it, past a SCRIPT FLUSH or a failover" },
    { path = "redis::ScriptInvocation::invoke_async", reason = "run a script through RedisConnection::invoke: it loads the script again on the node that forgot it, past a SCRIPT FLUSH or a failover" },
    { path = "redis::Script::load_async", reason = "load a script through RedisConnection::load: on a Cluster it loads on every primary, never on a replica that may be down" },
]

disallowed-macros = [
    { path = "tokio::main", reason = "use #[nest_rs::main]: its runtime teardown is bounded by the shutdown budget" },
]
