[package]
name = "nest-rs-authz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ability-based authorization for NestRS: one ability definition driving an access gate, a SeaORM query pre-filter, and response field-masking. Transport bindings (`http`, `graphql`, `mcp`) live behind Cargo features; the database-coupled extractors (`Bind`, `bind`) live in `nest-rs-seaorm` so the engine stays free of a data-layer dependency."
keywords = ["framework", "nestrs", "authorization", "permissions", "rbac"]
categories = ["authentication", "web-programming"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


[features]
default = []
# HTTP surface: poem extractors (`Authorize`, `Scope`), the `AbilityGuard`'s
# HTTP entry, and the `RouteResponseShaper` that masks responses transparently.
# The `Bind` route-model extractor lives in `nest_rs_seaorm::Bind` (it must use
# the data layer). `AbilityGuard` itself is at the crate root and every
# transport feature turns it on, because it answers all four; its
# `GuardFor<HttpView>` comes with it, since every edge runs `check_http` on an
# HTTP request, and each in-band feature declares its own edge's view.
http = [
    "dep:nest-rs-http",
    "dep:poem",
]
# GraphQL surface: the `ability` accessor + `ContextSeed`, and the response
# mask. The class gate is `class_gate`, every edge's, at the crate root. The
# resolver-side `bind` helper lives in `nest_rs_seaorm::graphql`.
graphql = [
    "dep:nest-rs-graphql",
    # The root `AbilityGuard` is what `/graphql`'s request runs, through its
    # `check_http` entry — so this surface needs `nest-rs-http`, which the
    # GraphQL bindings alone never named.
    "dep:nest-rs-http",
    "dep:poem",
]
# MCP surface: the response mask. Masking inside a tool body is the
# transport-free `masked_output_ambient`; the edge opens each operation's unit
# of work through the bound `UnitOfWork`.
mcp = [
    "dep:nest-rs-mcp",
    # Same as GraphQL: the root guard's `check_http` is what `/mcp`'s request runs.
    "dep:nest-rs-http",
    "dep:poem",
]
# WebSocket surface: the per-message reply mask (`ws::masked_reply_for`) that
# `#[messages]` emits from an `#[authorize(Action, Entity)]`, beside the class
# gate every edge shares. A gateway's upgrade runs the HTTP chain, and what a
# message needs re-established is the ambient ability, which the connection
# carries.
ws = [
    "dep:nest-rs-ws",
    # The root guard's `check_http` entry is what runs on the upgrade.
    "dep:nest-rs-http",
    "dep:poem",
]
# Enable every transport binding at once — useful for
# `cargo test -p nest-rs-authz --features full`.
full = ["http", "graphql", "ws", "mcp"]

[dependencies]
# Engine: always required.
# A rule's condition lowers to `sea_orm::Condition`; in-memory checks read
# columns via `ModelTrait::get`. `with-chrono` makes the temporal `Value`
# variants exist so the in-memory `Cmp` interpreter can order timestamp
# columns (the dominant scalar-comparison use case) regardless of which
# features the consuming workspace enables.
sea-orm = { workspace = true, features = ["with-chrono"] }
# Response masking serializes a model then strips disallowed keys.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `AbilityBuilder::build` returns a typed error when a rule's relation
# predicate is malformed (the `Deny` sentinel).
thiserror.workspace = true
# The kernel every crate composes on: the engine names it for
# `error_message`, which renders a masking failure's cause chain. It was
# optional while only the transport bindings named it, and the engine
# naming it under `default = []` is what broke `authz` alone.
nest-rs-core.workspace = true
# The class gate answers with the guards' `Denial`, which every edge renders;
# the guard contract depends on the kernel alone, so the gate stays ungated.
nest-rs-guards.workspace = true

# Optional dependencies — pulled in by the feature flags above.
nest-rs-http = { workspace = true, optional = true }
nest-rs-graphql = { workspace = true, optional = true }
nest-rs-mcp = { workspace = true, optional = true }
nest-rs-ws = { workspace = true, optional = true }
poem = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency: turn on every transport binding for this crate's own
# test targets. Without it `cargo nextest run --workspace` (the Definition of
# done) builds this crate with `default = []`, so every `#[cfg(feature = …)]`
# edge test in `tests/integration/` compiles away — the http / graphql / mcp
# suites would exist but never run. Dev-deps do not propagate, so no consumer
# gains a feature from this.
nest-rs-authz = { path = ".", features = ["full"] }
# Engine-only tests: `tests/ability.rs` builds a throwaway SeaORM entity and
# renders `condition_for` to SQL; the masking tests serialize a model via serde.
sea-orm.workspace = true
serde.workspace = true
# The edge tests boot the full surface (HTTP + GraphQL); compiled when the
# corresponding feature is enabled (`cargo test -p nest-rs-authz --features full`).
nest-rs-core = { path = "../nest-rs-core" }
nest-rs-http = { path = "../nest-rs-http" }
nest-rs-graphql = { path = "../nest-rs-graphql" }
nest-rs-guards = { path = "../nest-rs-guards" }
nest-rs-interceptors = { path = "../nest-rs-interceptors" }
# The class gate's order is proved against a route-scoped filter, which sees
# every error its route returns.
nest-rs-filters = { path = "../nest-rs-filters" }
# The `ws` mirror suites declare a real `#[gateway]`, whose expansion names
# `::nest_rs_ws::` paths at the call site.
nest-rs-ws = { path = "../nest-rs-ws" }
# The `ws` module's example writes `#[expose]`, whose expansion implements this
# crate's `WireModelDefaults`. Path-only: seaorm depends on this crate, and only
# a versionless dev-edge keeps that from being a cycle a publish cannot order.
# `http`, for the class gate's order on a `#[crud]` controller.
nest-rs-seaorm = { path = "../nest-rs-seaorm", features = ["http"] }
# `graphql`: a gated subscription driven as a caller (`graphql_socket`).
nest-rs-testing = { path = "../nest-rs-testing", features = ["graphql", "http"] }
# A crate that defines `#[resolver]`s needs `async-graphql` as a direct dep,
# since the generated `#[Object]` code names `async_graphql::` paths.
async-graphql.workspace = true
serde_json.workspace = true
# The alias pin-test's un-shaped routes emit an OpenAPI response schema, which
# puts a `JsonSchema` bound on their `Json<T>` payloads.
schemars.workspace = true
tokio.workspace = true
poem.workspace = true

[lints]
workspace = true
