[package]
name = "nest-rs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Scaffolding CLI for NestRS — new projects, feature generators, and project health checks."
keywords = ["framework", "nestrs", "cli", "scaffolding", "generator"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "nest_rs_cli"
path = "src/lib.rs"

[[bin]]
name = "nestrs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# `g migration` stamps the migration filename with today's date.
chrono.workspace = true
clap.workspace = true
# `lint` pairs a file's stem against the types it declares, and reads them with
# Rust's own parser: a `pub struct` inside a template string is what a text scan
# counts and a parser does not, and this crate ships such a string.
syn.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
