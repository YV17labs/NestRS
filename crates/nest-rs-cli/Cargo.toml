[package]
name = "nest-rs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Scaffolding CLI for NestRS — new projects, feature generators, and project health checks."
keywords = ["framework", "nestrs", "cli", "scaffolding", "generator"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "nest_rs_cli"
path = "src/lib.rs"

[[bin]]
name = "nestrs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# `g migration` stamps the migration filename with today's date.
chrono.workspace = true
clap.workspace = true
# `lint` pairs a file's stem against the types it declares, and reads them with
# Rust's own parser: a `pub struct` inside a template string is what a text scan
# counts and a parser does not, and this crate ships such a string.
syn.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The doctor's parity tests run the loader it mirrors beside it. Path-only
# dev-dependencies: they never reach `cargo install`, so the command still links
# no framework crate, and publishing strips them.
nest-rs-config = { path = "../nest-rs-config" }
# The selector and the prefix a cascade may not name, from the kernel's own
# constants rather than a literal.
nest-rs-core = { path = "../nest-rs-core" }
# `figment::Jail` sets and restores the working directory and the environment
# the loader reads, as `nest-rs-config`'s own suite does.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
