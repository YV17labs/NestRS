[package]
name = "nest-rs-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Configuration loading for NestRS apps — namespaced env mapping bound to typed pinned configs."
keywords = ["framework", "nestrs", "config", "configuration", "env"]
categories = ["config"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror.workspace = true
# `Config::load` runs declarative `#[validate(...)]` checks after the explicit
# `from_env` mapping — the same `validator` the HTTP `ValidationPipe` uses.
validator.workspace = true
# `ConfigModule::for_feature` queues a config-loading factory on the container,
# so this crate reaches into the kernel. The reverse never holds — `nest-rs-core`
# does not depend on `nest-rs-config`, so there is no cycle.
nest-rs-core.workspace = true
# `anyhow::Error` is the factory's error type (a failed load aborts the boot).
anyhow.workspace = true
# Structured `warn` when the `.env` cascade hits an unreadable file or malformed
# lines — config silently vanishing is a debugging tarpit.
tracing.workspace = true
# `ConfigService::json`: a structured value — a list of records, a map — is
# written as JSON, decoded here once for every config, and refused through
# `nest_rs_core::DecodeError`, which never quotes the value.
serde.workspace = true
serde_json.workspace = true
# Re-exported `#[config]` decorator. A `*-macros` crate emits absolute-path
# tokens, so it never depends back on this surface crate.
nest-rs-config-macros.workspace = true
# `system_authorities`: the authorities the system trusts, as every TLS client
# the framework opens trusts them by default — read once, PEM.
rustls-native-certs.workspace = true
base64.workspace = true
# `tls` feature: `ClientTls` judges the material a TLS client presents with
# rustls's own parsers and checks, the ones the libraries it is handed to run.
rustls = { workspace = true, optional = true }

[features]
# The shared client-TLS vocabulary (`ClientTls`, `TlsIdentity`,
# `crypto_provider`), enabled by every crate that opens a TLS client.
tls = ["dep:rustls"]

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK` for `read_material`: opening a FIFO a `_FILE` variable names
# would otherwise block the boot, and checking the path first races a swap.
libc.workspace = true

[dev-dependencies]
# `LogCapture`: the cascade's refusals are `warn`s and nothing else — a skipped
# line or an unreadable file leaves the value absent, so the event is the only
# evidence the loader ever saw it. Dev-only, so the cycle back to this crate
# never reaches a consumer build.
nest-rs-testing = { path = "../nest-rs-testing", features = ["tls"] }
# `figment::Jail` isolates the process env + cwd for the loader/cascade tests.
figment = { workspace = true, features = ["test", "toml"] }
# The custom-prefix suite boots a real app (`ConfigModule::for_feature` is an
# async factory), which is what proves the declared prefix reaches the field —
# compiling only proves the name was built.
tokio.workspace = true

[lints]
workspace = true
