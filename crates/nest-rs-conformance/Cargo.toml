[package]
name = "nest-rs-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Structural checks over the framework's paths and manifests: the naming law, the test layout, and the names written outside Rust."
# Internal proof crate — never published. It ships no capability.
publish = false

[dependencies]
# Declarations are read with Rust's own parser rather than a regex: a
# `\`-continued literal and a `#[cfg(test)]` fixture are what a text scan reads
# wrong.
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true }
quote = { workspace = true }
# The umbrella's `[features]` table: a wrapped list is what a line scan gets
# wrong.
toml_edit = { workspace = true }

# The `canon` binary prints the facts the docs linter checks pages against, so
# it serializes; a binary's dependencies are the library's.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The naming checks run `nestrs lint`'s own code and the CLI's reserved
# vocabulary rather than a second copy of either.
nest-rs-cli = { path = "../nest-rs-cli" }
# The near-miss check judges namespaces by the unclaimed-variable report's own
# rule.
nest-rs-config = { path = "../nest-rs-config" }

[lints]
workspace = true
