[package]
name = "nest-rs-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Joins the framework's own families against the suites that cover them: a member the framework declares and no test names is a failure, not an oversight."
# Internal proof crate — never published. It ships no capability; the proof is
# that its suite fails when a family grows a member nobody covers.
publish = false

[dependencies]
# A join reads Rust with Rust's own parser rather than with a regex: a
# `\`-continued message and a `#[cfg(test)]` block are the two things a text
# scan gets wrong, and both cost a false reading here before this crate existed.
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true }
quote = { workspace = true }

# The umbrella's `[features]` table is read with a TOML parser for the reason the
# rest is read with `syn`: a wrapped list is what a line scan gets wrong. It sat
# in `[dev-dependencies]` while the `umbrella` join was its only reader; the
# `canon` join is the second, and both now read one `sources::umbrella_matrix`
# so the word "capability" is derived once rather than per join. That moves the
# parse under `src/`, hence this line. The graph it widens is empty — the crate
# is `publish = false` and nothing links it but its own tests.
toml_edit = { workspace = true }

# `canon` writes the facts file the docs linter reads, so it serializes. A join
# that only asserts needs neither, which is why they stay a dev edge.
[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
