[package]
name = "nest-rs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core building blocks (DI container, module trait, lifecycle, access graph) for the NestRS framework."
keywords = ["framework", "nestrs", "di", "dependency-injection", "ioc"]
categories = ["rust-patterns", "asynchronous"]


[features]
default = ["logging"]
# Baseline console subscriber (`logging.rs`) — a bare app logs out of the box;
# a subscriber installed first wins. Disable for an embedder that brings its own
# and wants the kernel free of `tracing-subscriber`. Not reachable alongside
# `nest-rs-opentelemetry`, which enables this feature for the formatters and
# depends on `tracing-subscriber` itself either way.
logging = ["dep:tracing-subscriber"]

[dependencies]
thiserror.workspace = true
nest-rs-core-macros.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# `panic::contain`'s future marks only its unit's polls, so it projects the
# pin to the unit it wraps; `unsafe_code` is denied.
pin-project-lite.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Link-time registry: each `#[hooks]` method submits a lifecycle hook so `App`
# composes them at boot with no central list (same mechanism as GraphQL).
inventory.workspace = true
# Re-exported for `#[input]`, whose derives route back here with a `crate = `
# override. The kernel is the only crate every capability already has, so a
# wire DTO costs no transport it does not otherwise use.
serde.workspace = true
# `DecodeError` reads a payload's decode failure without the value serde quoted —
# the one report every edge that decodes JSON files. Its suite also parses
# `JsonFormat`'s lines, the only proof a hand-written envelope is JSON.
serde_json.workspace = true
schemars.workspace = true
validator.workspace = true
# Request-scope cache lock — poison-free locking off the request hot path.
parking_lot.workspace = true
# A trace id's bytes are a UUID v7's: time-ordered, so ids sort by arrival and
# the value is a conformant W3C trace-id. In the kernel because the correlation
# primitive cannot be optional — see `trace_context.rs`.
uuid.workspace = true

[dev-dependencies]
# `LogCapture`: the container's two survivable conflicts (a keyed override, a
# scope that changes under a type) warn and continue, so the event is the only
# trace a shadowed provider leaves. Dev-only, so the cycle back to this crate
# never reaches a consumer build.
nest-rs-testing = { path = "../nest-rs-testing" }
# `test-util` (not part of tokio's `full`) pauses time, so a shutdown hook that
# never returns is abandoned at its bound without the suite waiting it out.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
