[package]
name = "nest-rs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core building blocks (DI container, module trait, lifecycle, access graph) for the NestRS framework."
keywords = ["framework", "nestrs", "di", "dependency-injection", "ioc"]
categories = ["rust-patterns", "asynchronous"]


[features]
default = ["logging"]
# Baseline console subscriber (`logging.rs`) — a bare app logs out of the box;
# a subscriber installed first (e.g. nest-rs-opentelemetry) wins. Disable for
# an embedder that brings its own subscriber and wants the kernel free of
# `tracing-subscriber` in its dependency tree.
logging = ["dep:tracing-subscriber"]

[dependencies]
thiserror.workspace = true
nest-rs-core-macros.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Link-time registry: each `#[hooks]` method submits a lifecycle hook so `App`
# composes them at boot with no central list (same mechanism as GraphQL).
inventory.workspace = true
# Re-exported for `#[input]`, whose derives route back here with a `crate = `
# override. The kernel is the only crate every capability already has, so a
# wire DTO costs no transport it does not otherwise use.
serde.workspace = true
schemars.workspace = true
validator.workspace = true
# Request-scope cache lock — poison-free locking off the request hot path.
parking_lot.workspace = true

[dev-dependencies]
# Snapshot-tests the core macro compile diagnostics (`#[injectable]`, `#[module]`)
# — the exact error a developer sees is part of the contract (CORE-I10), the
# same net the http/graphql/ws macros already have.
trybuild.workspace = true

[lints]
workspace = true
