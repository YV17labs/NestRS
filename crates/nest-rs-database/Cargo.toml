[package]
name = "nest-rs-database"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ORM-agnostic data-layer seam for NestRS: the ambient request/job Executor, carried by the kernel's ambient context, plus the object-safe Executor trait an ORM module implements. SeaORM is the first-party implementation (nest-rs-seaorm), and the trait is public so other stores can be written against it."
keywords = ["framework", "nestrs", "database", "orm", "transaction"]
categories = ["database"]


[dependencies]
# The ambient executor and its scope are one value of the kernel's ambient
# context, which carries them across every continuation by their own rule.
nest-rs-core.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
