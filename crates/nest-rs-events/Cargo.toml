[package]
name = "nest-rs-events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed in-process event bus for NestRS: emit a typed event, dispatch to discovered #[on_event] methods grouped under #[listeners]."
keywords = ["framework", "nestrs", "events", "event-bus", "pubsub"]
categories = ["asynchronous", "rust-patterns"]


[dependencies]
nest-rs-core.workspace = true
nest-rs-events-macros.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Listener-registry lock — poison-free locking on the emit path.
parking_lot.workspace = true
# `catch_unwind` on each listener future: a panicking listener is contained to
# itself rather than unwinding through `emit` into the emitter's request.
futures-util.workspace = true

[dev-dependencies]
tokio.workspace = true
# A contained panic that logs nothing would be a silent failure — `LogCapture`
# covers the event half of the containment contract.
nest-rs-testing = { path = "../nest-rs-testing" }

[lints]
workspace = true
