[package]
name = "nest-rs-graphql-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal — the GraphQL decorator macros (#[resolver], #[operations], #[crud], #[dataloader]); re-exported by nest-rs-graphql, not a direct dependency."
keywords = ["framework", "nestrs", "graphql", "macros", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[features]
# `#[operations]` reads an attribute named `resilient` as the resilience
# capability's decorator, kept on the developer's method, only in a build that
# enables that capability: without it, every attribute is placed as 7.0.0 placed
# them. `nest-rs-graphql`'s `resilience` feature enables it.
resilience = []

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
nest-rs-codegen.workspace = true

[lints]
workspace = true
