[package]
name = "nest-rs-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "GraphQL resolver discovery + schema composition for NestRS apps, on top of async-graphql."
keywords = ["framework", "nestrs", "graphql", "async-graphql", "web"]
categories = ["web-programming", "asynchronous"]


[dependencies]
nest-rs-core.workspace = true
nest-rs-graphql-macros.workspace = true
# The ORM-agnostic unit-of-work port: each operation runs as a unit of its own
# through the binding the mount resolves (`run_unit`), and each mutation root
# field in an `atomic` block of it. No ORM is named — with no binding an
# operation runs bare.
nest-rs-database.workspace = true
# `GraphqlModule` owns its `#[config]` `GraphqlConfig` (namespace `graphql`),
# loaded from `NESTRS_GRAPHQL__*`; `validator` backs its `#[validate]` derive.
nest-rs-config.workspace = true
# The `/graphql` endpoint round-trips operation variables through JSON to run
# the global pipes over them (`ArgumentKind::Variables`).
serde_json.workspace = true
validator.workspace = true
# GraphqlModule self-mounts over HTTP via HttpEndpointMeta — this crate serves
# GraphQL on the HTTP transport. No cycle: nest-rs-http does not depend on us.
nest-rs-http.workspace = true
async-graphql.workspace = true
# `#[crud]`-generated create/update ops validate their input through the
# re-exported `ValidateProbe` (global validation, the NestJS `ValidationPipe`
# analog); re-exported so a crud consumer needs no direct nest-rs-pipes dep.
nest-rs-pipes.workspace = true
# Re-exported as `nest_rs_graphql::async_trait` for implementors of its async
# seams.
async-trait.workspace = true
# The edge runs its guards itself: the pool at the request, each field's chain,
# the federation gate; it renders a denial in GraphQL's error form.
nest-rs-guards.workspace = true
# Re-exported so the GraphqlModule mount code can name the poem integration
# through the framework, keeping it out of every app's manifest.
async-graphql-poem.workspace = true
# The graphql-ws loop is this crate's own — the one place a socket's end can
# enter the protocol — so it splits the socket and reads both halves as streams.
futures-util.workspace = true
# Re-exported so `#[resolver]`-generated `inventory::submit!` resolves through
# the framework without apps depending on `inventory` directly.
inventory.workspace = true
poem.workspace = true
# GraphqlModule logs the boot-time SDL emit through the framework's tracing.
tracing.workspace = true
# A DataLoader batch is spawned onto the runtime, under what its request
# carries into it.
tokio.workspace = true

[dev-dependencies]
# Boot the schema in-process and fire GraphQL requests at it (the ContextSeed
# tests). nest-rs-http/nest-rs-core are already runtime deps above. `ws`
# binds a real port: the graphql-ws socket's way down — `complete`, then the
# Close frame — exists only over a real upgrade, and so does the shutdown window
# a DataLoader batch is stopped at.
nest-rs-testing = { path = "../nest-rs-testing", features = ["graphql", "http", "ws"] }
# The layer-pool test asserts the transport-edge interceptor pool covers the
# `/graphql` self-mount. An allowed dev-dependency cycle: the interceptors
# depend on `nest-rs-http`, which this crate does.
nest-rs-interceptors = { path = "../nest-rs-interceptors" }
# `test-util` (not part of tokio's `full`) pauses time, so the socket-lifetime
# ceiling is asserted against a four-hour deadline in microseconds instead of
# being approximated by a wall-clock sleep nobody would keep honest.
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true

[lints]
workspace = true
