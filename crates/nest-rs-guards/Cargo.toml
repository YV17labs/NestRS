[package]
name = "nest-rs-guards"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One guard contract for NestRS — a guard checks an HTTP request or any edge's unit, declared once with App::builder().use_guards_global(...)."
keywords = ["framework", "nestrs", "guards", "authorization", "middleware"]
categories = ["web-programming", "authentication"]

[dependencies]
async-trait.workspace = true
tracing.workspace = true
# The machine-readable half of a denial the in-band edges answer, one JSON
# object every edge with no status line carries the same way.
serde_json.workspace = true
# The only framework crate below this one: the contract names a unit's context,
# never an edge's types, so every edge depends on guards and guards on none.
nest-rs-core.workspace = true

[dev-dependencies]
# The webhook guard's suite boots a route over the HTTP edge, and drains the
# body through the edge's cap. `test-util` pauses time for its gap bound.
tokio = { workspace = true, features = ["test-util"] }
nest-rs-http = { path = "../nest-rs-http" }
nest-rs-testing = { path = "../nest-rs-testing" }
# `#[routes]` composes a route's response-side layers through the interceptors.
nest-rs-interceptors = { path = "../nest-rs-interceptors" }
# The body-reading guard the docs teach for a webhook verifies an HMAC-SHA256
# (aws-lc-rs, the workspace's crypto backend) over base64 signatures, as
# Standard Webhooks spells them.
aws-lc-rs.workspace = true
base64.workspace = true

[lints]
workspace = true
