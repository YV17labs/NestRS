[package]
name = "nest-rs-health"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reusable Kubernetes-style liveness/readiness probe module for NestRS applications."
keywords = ["framework", "nestrs", "health", "kubernetes", "readiness"]
categories = ["web-programming"]

[dependencies]
nest-rs-config.workspace = true
nest-rs-core.workspace = true
# The probe controller's `#[controller]`/`#[routes]` expansion names the guard
# declarations and composes the route's response-side layers through the
# interceptors, as every route does.
nest-rs-guards.workspace = true
nest-rs-health-macros.workspace = true
nest-rs-http.workspace = true
nest-rs-interceptors.workspace = true
# The indicators of one probe run concurrently on the probe's own task — never
# `spawn`, which would file their events under no unit of work — so the join is
# `FuturesUnordered` rather than a task set.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# The probe's deadline over its indicators (`timeout_at`); each indicator's own
# ceiling is `nest_rs_core::within`, so a dead peer can't hang the public
# `/health/ready` probe.
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `test-util` (not part of tokio's `full`) pauses time, so "four checks cost one
# interval, not four" is asserted on a virtual clock instead of a wall-clock
# margin that flakes on a loaded runner.
tokio = { workspace = true, features = ["test-util"] }
# A probe's contract has two halves: the body an operator can read off an open
# port, and the log line carrying what the body deliberately withholds. Path-only
# (intra-workspace dev-edge), per the manifest rule.
nest-rs-testing = { path = "../nest-rs-testing", features = ["http"] }

[lints]
workspace = true
