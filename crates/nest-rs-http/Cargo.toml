[package]
name = "nest-rs-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP transport for NestRS: HttpTransport, Controller trait and HttpControllerMeta, built on top of poem."
keywords = ["framework", "nestrs", "http", "web", "poem"]
categories = ["web-programming::http-server", "asynchronous"]


[features]
# The WebSocket opening handshake on hyper's upgrade and the socket above it,
# for the edges that speak one: `nest-rs-ws` and `nest-rs-graphql` enable it.
websocket = ["dep:tokio-tungstenite"]

[dependencies]
nest-rs-core.workspace = true
nest-rs-http-macros.workspace = true
# The edge runs its guards itself: a route's, a self-mount's request. The guard
# contract names no HTTP type, so the dependency points this way.
nest-rs-guards.workspace = true
# `HttpTls::from_env` reads the `<PREFIX>_HTTP__TLS_*` keys through the
# framework-wide env scheme (`env_var`, empty-as-unset), like every other
# per-crate `from_env` shortcut; `tls` brings the process's crypto provider
# and the one check that a certificate is its key's.
nest-rs-config = { workspace = true, features = ["tls"] }
# The pipes themselves are transport-agnostic; this crate only adapts them to
# poem (the `Valid`/`Piped` extractors). `validator` is needed for the `Validate`
# bound on `Valid`; `serde_json` renders a `PipeError` as a JSON 400.
nest-rs-pipes.workspace = true
validator.workspace = true
serde_json.workspace = true
# `#[routes]` captures the JSON schema of each `Json<T>` payload into
# `HttpRouteMeta` so an OpenAPI generator (nest-rs-openapi) can read it. schemars
# does the schema derivation — the same crate (and `JsonSchema` derive) that MCP
# tool parameters already use. Re-exported below so macro-generated
# `::nest_rs_http::schemars::…` paths resolve at the call site.
schemars.workspace = true
poem.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `serde` derives `Serialize` on the RFC 9457 `ProblemDetails` body so the
# response carries an `application/problem+json` payload.
serde.workspace = true
# `RawBody` returns the body as `bytes::Bytes` (zero-copy view) with a size
# guard.
bytes.workspace = true
# The access log's byte counter is an `http_body::Body` wrapper that forwards
# `size_hint`, so the response keeps its `Content-Length` instead of falling back
# to chunked framing. `http_body_util::combinators::BoxBody` is the type poem's
# public `From<Body>` / `From<BoxBody>` impls convert through.
http-body.workspace = true
http-body-util.workspace = true
# The vocabulary's head, status, method and headers are the `http` crate's own,
# re-exported as their one path.
http.workspace = true
thiserror.workspace = true
futures-util.workspace = true
# The accept loop is the transport's own: hyper serves each connection, and
# hyper-util's `auto` builder tells HTTP/1 from HTTP/2 and drives both on tokio.
# hyper also puts an upgrade request's `OnUpgrade` in its extensions; the poem
# bridge clones it by type so both sides of a crossing can take the upgraded
# socket.
hyper.workspace = true
hyper-util.workspace = true
# The HTTP/2 hyper serves: an error it ends a connection on is said without the
# peer's GOAWAY debug data, which its `Display` appends. The suites drive it as
# a client too, to read the server's SETTINGS frame.
h2.workspace = true
# The TLS listener: a handshake per accepted socket, the certificate read from a
# resolver a renewal swaps without rebuilding the listener.
tokio-rustls.workspace = true
rustls.workspace = true
# Behind `websocket`: the frames over an upgraded socket. `handshake` is the
# accept key the `101` answers with.
tokio-tungstenite = { workspace = true, optional = true, features = ["handshake"] }

[dev-dependencies]
# The suites exercise the upgrade, so they build the crate with `websocket` on.
nest-rs-http = { path = ".", features = ["websocket"] }
# `LogCapture`: several transport refusals answer one status code for two very
# different causes (an unreadable version header and a malformed one both give
# `400`), so the event is what separates them for an operator.
nest-rs-testing = { path = "../nest-rs-testing", features = ["http", "tls"] }
# Pipe/scope unit tests build small `Serialize`/`Deserialize` payloads to feed
# the `Json<T>` extractor in `from_request` test paths.
serde.workspace = true
# `#[routes]` composes a route's response-side layers through
# `nest-rs-interceptors`, so any test using `#[routes]` needs it in scope. An
# allowed dev-dependency cycle: the interceptors depend on this crate.
nest-rs-interceptors = { path = "../nest-rs-interceptors" }
# `test-util` (not part of tokio's `full`) pauses time, so the shutdown window is
# proved at its default length without the suite waiting it out.
tokio = { workspace = true, features = ["test-util"] }
# The client half of the WebSocket the suites open — the crate the server half
# runs on, so it adds no crate to the graph.
tokio-tungstenite = { workspace = true, features = ["connect"] }
# `tests/global_prefix.rs` env-path test isolates the process env via
# `figment::Jail`, matching how `nest-rs-config` itself tests env reads.
figment = { workspace = true, features = ["test"] }
# Dev-only, and deliberately so: the version grammar is worded once in
# `nest_rs_codegen`, but that crate pulls `syn`, which must never reach an app's
# dependency graph. So the runtime half carries its own copy of the predicate and
# `versioning::the_wire_grammar_matches_the_declared_grammar` pins the two
# together — the drift is a test failure rather than a version the compiler
# accepts and the wire refuses.
nest-rs-codegen = { path = "../nest-rs-codegen" }
# `tests/integration/tls.rs` needs a *real* TLS client: the certificate swap is
# only observable through a handshake, which the kit's in-process `TestClient`
# never performs.
reqwest.workspace = true
# `tests/integration/body_limit.rs` gzips a request body, so the cap is proved
# against the composition that defeated it rather than against a hand-set header.
flate2.workspace = true
futures-util.workspace = true
# The access line's unit tests write it through the kernel's console format,
# which is what a query on the console's lines reads.
tracing-subscriber.workspace = true

[lints]
workspace = true
