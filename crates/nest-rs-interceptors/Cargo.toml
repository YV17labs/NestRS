[package]
name = "nest-rs-interceptors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The poem-typed interceptor of NestRS 6, which `nest_rs::core::Interceptor` replaced: nothing in the framework runs it, and the crate leaves in 7.0."
keywords = ["framework", "nestrs", "interceptors", "middleware", "web"]
categories = ["web-programming", "rust-patterns"]

[dependencies]
async-trait.workspace = true
poem.workspace = true
nest-rs-core.workspace = true
# The suite reads `StatusCode`; the two siblings are unused since the pipeline
# replaced this crate, and leave with it in 7.0.
nest-rs-http.workspace = true
nest-rs-filters.workspace = true
nest-rs-exception-filters.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true
# `LogCapture`: a route whose layer resolves to nothing answers an opaque `500`,
# and the `error` naming the layer is the operator's only record of why.
nest-rs-testing = { path = "../nest-rs-testing" }

[lints]
workspace = true
