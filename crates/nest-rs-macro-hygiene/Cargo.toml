[package]
name = "nest-rs-macro-hygiene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time witness that nest-rs decorators emit only ::std/::core paths or paths rooted at the umbrella: this crate consumes them through a single dependency, with no third-party crate, and its suite pins what they refuse."
# Internal proof crate — never published; the proof is that it compiles.
publish = false

[dependencies]
# The one dependency: a decorator whose expansion needs a second line here
# fails this crate's build.
nest-rs = { path = "../nest-rs", default-features = false }

# One feature per umbrella capability that owns a decorator, or a `for_root`
# whose refusal a developer reads.
[features]
default = ["authn", "authz", "config", "events", "graphql", "health", "http", "mcp", "oauth-resource", "queue", "schedule", "seaorm", "static-files", "ws"]
# `#[derive(PrincipalIdentity)]` on a claims type, and the custom `Strategy`
# whose principal derives it, run by a guard a `#[controller]` binds.
authn = ["nest-rs/authn"]
# `#[subject]`, and the gate-only posture each edge's witness declares on it.
authz = ["nest-rs/authz"]
config = ["nest-rs/config"]
events = ["nest-rs/events"]
graphql = ["nest-rs/graphql"]
health = ["nest-rs/health"]
http = ["nest-rs/http"]
mcp = ["nest-rs/mcp"]
oauth-resource = ["nest-rs/oauth-resource"]
queue = ["nest-rs/queue"]
# `redis-<port>` owns no decorator: each is the witness that its binding is
# reached through that feature alone, since `redis` is the connection and
# compiles no binding — and `redis-health` that the connection's indicator
# compiles through `redis` beside `health`, which forwards it weakly. Off by
# default, where it would link the Redis client into the suite's fixtures,
# whose snapshots list a trait's implementors across every crate linked.
redis-health = ["nest-rs/redis", "nest-rs/health"]
redis-queue = ["nest-rs/redis-queue"]
redis-schedule = ["nest-rs/redis-schedule"]
redis-throttler = ["nest-rs/redis-throttler"]
schedule = ["nest-rs/schedule"]
# `#[expose]` and the entity every `#[authorize(Action, Entity)]` witness names.
# `#[crud]` rides `http` and `seaorm` together.
seaorm = ["nest-rs/seaorm"]
static-files = ["nest-rs/static-files"]
# `queue_kit!` and `TestAuthority` beside `queue`, as a driver's suite reaches
# them, and the signing key beside `authn`, as an app's does. Off by default for `redis-<port>`'s reason: it links the harness into
# the fixtures, whose snapshots list a trait's implementors.
testing = ["nest-rs/testing"]
ws = ["nest-rs/ws"]

# The suite pins the decorators' refusals; its fixtures name the crates a
# developer's own code names beside the umbrella.
[dev-dependencies]
trybuild.workspace = true
anyhow.workspace = true
async-graphql.workspace = true
futures-util.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
