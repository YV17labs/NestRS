[package]
name = "nest-rs-macro-hygiene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time witness that nest-rs decorators emit only ::std/::core paths or paths rooted at the umbrella: this crate consumes them through a single dependency, with no third-party crate, and its suite pins what they refuse."
# Internal proof crate — never published; the proof is that it compiles.
publish = false

[dependencies]
# The one dependency: a decorator whose expansion needs a second line here
# fails this crate's build.
nest-rs = { path = "../nest-rs", default-features = false }

# One feature per umbrella capability that owns a decorator.
[features]
default = ["config", "events", "graphql", "health", "http", "mcp", "queue", "schedule", "seaorm", "ws"]
config = ["nest-rs/config"]
events = ["nest-rs/events"]
graphql = ["nest-rs/graphql"]
health = ["nest-rs/health"]
http = ["nest-rs/http"]
mcp = ["nest-rs/mcp"]
queue = ["nest-rs/queue"]
schedule = ["nest-rs/schedule"]
# `#[expose]`, `#[wire_enum]` and the entity every `#[authorize(Action, Entity)]`
# witness names. `#[crud]` rides `http` and `seaorm` together.
seaorm = ["nest-rs/seaorm"]
ws = ["nest-rs/ws"]

# The suite pins the decorators' refusals; its fixtures name the crates a
# developer's own code names beside the umbrella.
[dev-dependencies]
trybuild.workspace = true
anyhow.workspace = true
async-graphql.workspace = true
futures-util.workspace = true
poem.workspace = true
sea-orm.workspace = true
serde.workspace = true
tracing.workspace = true

[lints]
workspace = true
