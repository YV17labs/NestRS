[package]
name = "nest-rs-macro-hygiene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time witness that nest-rs decorators emit only ::std/::core paths or paths rooted at the umbrella: this crate consumes them through a single dependency, with no third-party crate."
# Internal proof crate — never published; the proof is that it compiles.
publish = false

[dependencies]
# ONE dependency, and it must stay one. This crate is the witness named by
# `CLAUDE.md`'s *The umbrella is the front door*: if a decorator's expansion
# ever needs a second line here — a sibling `nest-rs-*` or any third-party
# crate — the rule is broken and this crate stops compiling. That failure is
# the point.
#
# The features are exactly the capabilities exercised below.
#
# **What this proves and what it does not.** It proves that the decorators in
# `src/` need no dependency but the umbrella — a bare third-party path in any
# expansion fails to resolve here, because nothing third-party is in this
# crate's extern prelude. It does **not** prove each capability pulls its own
# satellites: all ten features build as one union, so a satellite `queue`
# forgot is still supplied by `http` and nothing fails. Splitting the witness
# per feature is what would close that, and it is an owner question rather than
# an edit — `nest-rs-conformance`'s umbrella join records the same limit beside
# the column it fills.
nest-rs = { path = "../nest-rs", default-features = false, features = [
    "config",
    "events",
    "graphql",
    "health",
    "http",
    "mcp",
    "queue",
    "resource",
    "schedule",
    "ws",
] }

[lints]
workspace = true
