[package]
name = "nest-rs-macro-hygiene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time witness that nest-rs decorators emit only ::std/::core paths or paths rooted at the umbrella: this crate consumes them through a single dependency, with no third-party crate."
# Internal proof crate — never published; the proof is that it compiles.
publish = false

[dependencies]
# ONE dependency, and it must stay one. This crate is the witness named by
# `CLAUDE.md`'s *The umbrella is the front door*: if a decorator's expansion
# ever needs a second line here — a sibling `nest-rs-*` or any third-party
# crate — the rule is broken and this crate stops compiling. That failure is
# the point.
nest-rs = { path = "../nest-rs", default-features = false }

# One feature per umbrella capability that owns a decorator, each forwarding to
# the umbrella's feature of the same name, and each witness module compiled
# under its capability's feature alone. Built as the default union, the crate
# proves no decorator needs a second manifest line; built one feature at a time
# (`scripts/check-features.sh`), it proves each capability pulls what its own
# decorators emit — a satellite a feature forgot, or a re-export gated on the
# wrong one, fails under that feature even when a sibling supplies it in the
# union.
[features]
default = ["config", "events", "graphql", "health", "http", "mcp", "queue", "schedule", "seaorm", "ws"]
config = ["nest-rs/config"]
events = ["nest-rs/events"]
graphql = ["nest-rs/graphql"]
health = ["nest-rs/health"]
http = ["nest-rs/http"]
mcp = ["nest-rs/mcp"]
queue = ["nest-rs/queue"]
schedule = ["nest-rs/schedule"]
# `#[expose]`, `#[wire_enum]` and the entity every `#[authorize(Action, Entity)]`
# witness names. `#[crud]` rides `http` and `seaorm` together.
seaorm = ["nest-rs/seaorm"]
ws = ["nest-rs/ws"]

# The `tokio::main` canary in `src/canary.rs` — the unit-test build only, so the
# witness above still compiles against the umbrella alone.
[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
