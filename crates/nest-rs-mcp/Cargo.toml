[package]
name = "nest-rs-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model Context Protocol server support for NestRS — wraps the rmcp SDK behind the NestRS DI container and exposes a poem endpoint."
keywords = ["framework", "nestrs", "mcp", "rmcp", "ai"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Source of the `#[input]` wire-DTO shorthand, re-exported so a payload
# crossing this transport declares no `serde` of its own.
nest-rs-http.workspace = true
# `McpConfig` is a `#[config]` struct: `NESTRS_MCP__*` env over a pinned base,
# the framework-wide dual-path rule.
nest-rs-config.workspace = true
nest-rs-core.workspace = true
nest-rs-mcp-macros.workspace = true
# Each request operation is a unit of work the endpoint runs through the bound
# `dyn UnitOfWork`, resolved once at mount.
nest-rs-database.workspace = true
# The edge runs its guards itself: the pool at the request, each operation's
# chain; it renders a denial as a JSON-RPC error.
nest-rs-guards.workspace = true
# `Valid<T>` / `Piped<P, T>` on a tool argument: the `#[mcp]` expansion runs the
# pipe over the wire value and renders a rejection as `invalid_params`.
nest-rs-pipes.workspace = true
# `Stream`, which the session manager wrapping rmcp's names in its signatures.
futures-util.workspace = true
# rmcp's `SessionStore` is an `async_trait`, which the store reporting an app's
# failures implements.
async-trait.workspace = true
poem.workspace = true
rmcp.workspace = true
schemars.workspace = true
# `Parameters<P>` is the framework's own, so an operation's arguments are decoded
# here and refused through `DecodeError` rather than in serde's quoting words.
serde.workspace = true
serde_json.workspace = true
# The session manager's error, which rmcp writes into the body it answers.
thiserror.workspace = true
# `task_local!` installs the per-operation `RequestScope` around the inner rmcp
# endpoint so tool methods reach it via `Scoped<T>`.
tokio.workspace = true
# Deny-all fallback and its boot warning log a security misconfig through
# the framework's tracing (span target `nest_rs::mcp`).
tracing.workspace = true

[dev-dependencies]
nest-rs-core = { path = "../nest-rs-core" }
# A real `ThrottlerGuard` in the global pool proves the fallback carries a
# non-authn guard's `429` — the behaviour `/mcp` could not have before.
nest-rs-throttler = { path = "../nest-rs-throttler" }
nest-rs-testing = { path = "../nest-rs-testing", features = ["http"] }
poem = { workspace = true, features = ["test"] }
# `Transport::serve` takes the token that asks it to stop — what the shutdown
# suite drives a real transport with.
tokio-util.workspace = true
# `test-util` (not part of tokio's `full`) pauses time while a transport stops
# and nothing reads a socket, so its window costs the suite nothing.
tokio = { workspace = true, features = ["test-util"] }
# Holds `McpIdentity`'s fields against the answers `#[mcp]`'s grammar gives
# (`identity.rs`): the grammar lives here because a proc-macro crate exports
# nothing a test can call.
nest-rs-codegen = { path = "../nest-rs-codegen" }

[lints]
workspace = true
