[package]
name = "nest-rs-oauth-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OAuth 2.0 authorization-server vocabulary for NestRS: RFC 6749 §2.3 client authentication at the token endpoint through a guard, §4.4.2's token request, §5.1's access token response and §5.2's token-endpoint error set."
keywords = ["framework", "nestrs", "oauth", "rfc6749", "authorization-server"]
categories = ["authentication", "web-programming"]

[dependencies]
# `AuthenticatedClient` is a `PrincipalIdentity` (one that answers `None`), and
# a registry refusal is an `AuthError`. The direction is the point: an issuer
# uses authn's vocabulary, so a worker that only verifies a JWT links `authn`
# and never compiles this crate.
nest-rs-authn.workspace = true
# `AuthenticatedClient` is what the authentication guard attaches for the rest
# of the request, so it is an ambient value.
nest-rs-core.workspace = true
# `ClientAuthenticationGuard` is a guard, bound with `#[use_guards]`.
nest-rs-guards.workspace = true
# `TokenError` renders itself as the §5.2 JSON envelope, and marks the response
# `NoBearerChallenge` so a token refusal is never dressed up as a
# oauth-resource challenge.
nest-rs-http.workspace = true
serde.workspace = true
serde_json.workspace = true
# `AccessTokenRequest`/`AccessTokenResponse` are documented request and response
# bodies, so they carry the schema the OpenAPI surface reads — the same derive
# every other wire type in the framework routes through.
schemars.workspace = true
thiserror.workspace = true
# Constant-time secret comparison for the registry — a client id that exists and
# one that does not must be indistinguishable by timing.
aws-lc-rs.workspace = true
# `TokenError::Sign`/`Server` keep the real cause attached for tracing while
# `Display` stays the opaque `server_error`.
anyhow.workspace = true
# The guard files each client it refuses.
tracing.workspace = true

[dev-dependencies]
# A token endpoint in an app that is a resource server too: its RFC 9728
# interceptor must leave a client's refusal as §5.2 words it.
nest-rs-oauth-resource = { path = "../nest-rs-oauth-resource" }
nest-rs-testing = { path = "../nest-rs-testing", features = ["http"] }
base64 = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
