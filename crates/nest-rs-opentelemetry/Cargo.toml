[package]
name = "nest-rs-opentelemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenTelemetry for NestRS: logs, traces, metrics, W3C propagation, OTLP export."
keywords = ["framework", "nestrs", "opentelemetry", "tracing", "otlp"]
categories = ["development-tools::debugging", "asynchronous"]


[features]
# OTLP exporter is default so a dev who sets NESTRS_OPENTELEMETRY__OTLP_ENDPOINT
# gets traces out of the box.
#
# There is no `http` feature, and its removal is the point: this crate used to
# mount a per-request interceptor, which reached one edge. What it did now hangs
# off the framework's span constructor, so a headless worker gets it too — and
# nothing here compiles poem or nest-rs-http any more.
#
# That sentence was false for as long as `nest-rs-http`, `nest-rs-interceptors`
# and `poem` stayed in `[dependencies]` as `optional` with no `dep:` reference:
# Cargo synthesises a public implicit feature per such entry, so
# `--features poem` built poem and the comment above described the opposite of
# what the manifest allowed. `tokio` and `async-trait` were the same shape
# without the feature — dependencies no source file named. All five are gone;
# what remains is what `src/` actually reaches.
default = ["otlp"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:uuid",
]

[dependencies]
# `logging` for `TextFormat` / `JsonFormat`: the console this crate installs is
# the kernel's console, not a second one. Stated rather than leaned on, even
# though it is one of `nest-rs-core`'s default features.
nest-rs-core = { workspace = true, features = ["logging"] }
nest-rs-config.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# `OpenTelemetryConfig::from_env` reads `NESTRS_OPENTELEMETRY__*` off the process
# env; the tests isolate it with `figment::Jail`, matching how `nest-rs-config`
# tests its env reads.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
