[package]
name = "nestrs-unit-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Test fixture for nest-rs-opentelemetry: a package that declares its own unit of work and opens it as the framework's edges do."
# A fixture crate, not a suite (the two-suite rule governs `tests/<suite>/`):
# a dev-dependency of nest-rs-opentelemetry, so a workspace member by Cargo's
# rule for path dependencies, and never published.
publish = false

[dependencies]
# Shaped as a package is: the umbrella, with only the features it binds.
nest-rs = { path = "../../../nest-rs", default-features = false }

[lints]
workspace = true
