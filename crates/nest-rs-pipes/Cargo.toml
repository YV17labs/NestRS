[package]
name = "nest-rs-pipes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Transport-agnostic transformation pipes and validation for NestRS, applied by each edge between decoding an argument and its handler."
keywords = ["framework", "nestrs", "pipes", "validation", "transform"]
categories = ["web-programming", "rust-patterns"]


[dependencies]
# Pipes are pure data transforms — no transport.
thiserror.workspace = true
# A `PipeError`'s structured `details` — what `PipeError::from` makes of
# `validator`'s errors — and a global pipe's input are JSON.
serde_json.workspace = true
validator.workspace = true
# `ParseUuid` / `ParseUuidVersion`.
uuid.workspace = true
# `GlobalPipe` extends `nest_rs_core::Layer` for the Layer System, and the
# global pool registers on `AppBuilder` and is checked at the wiring step.
nest-rs-core.workspace = true

[lints]
workspace = true
