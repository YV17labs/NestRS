[package]
name = "nest-rs-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend-agnostic queue contract for NestRS: traits and the link-time #[process] registry a backend plugs into. Redis ships first-party in nest-rs-redis, and the same public seam carries any other store."
keywords = ["framework", "nestrs", "queue", "jobs", "background"]
categories = ["asynchronous"]


[dependencies]
# Source of the `#[input]` wire-DTO shorthand, re-exported so a payload
# crossing this transport declares no `serde` of its own.
nest-rs-core.workspace = true
# Re-exported so call sites write `nest_rs_queue::processor` for the macro
# even though it physically lives in the macros crate; the macro emits paths
# rooted at `::nest_rs_queue::*`, so the macro and the abstractions ship from
# the same import root.
nest-rs-queue-macros.workspace = true
async-trait.workspace = true
anyhow.workspace = true
# Typed producer errors (`QueueError`) — the framework owns queue plumbing
# errors so features never redefine them.
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Re-exported for the `#[processor]` macro emission so the call site doesn't
# need a direct `tracing` dependency for the unversioned-payload warning.
tracing.workspace = true
# Re-exported for the same reason: `#[process]` runs each handler inside the
# ambient `JobContext`, so the expansion names the worker seam. Routing it
# through this crate keeps `nest_rs_queue` the single import a `#[processor]`
# call site needs — a bare `::nest_rs_worker::` path would resolve against the
# consumer's extern prelude and break any app that hasn't added the crate.
nest-rs-worker.workspace = true

[dev-dependencies]
tokio.workspace = true
serde.workspace = true
# Snapshot-tests the `#[process]` compile diagnostics
# (tests/integration/diagnostics/).
trybuild.workspace = true
# The diagnostics fixtures put a `#[process]` on an `#[injectable]`
# provider, the shape a real processor has.
nest-rs-core = { path = "../nest-rs-core" }
# `anyhow::Result<()>` is the `#[process]` method's return type.
anyhow.workspace = true

[lints]
workspace = true
