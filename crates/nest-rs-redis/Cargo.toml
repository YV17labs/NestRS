[package]
name = "nest-rs-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Redis for nest-rs: one shared connection (RedisModule), and one binding per port over it — the queue producer (RedisQueueModule), the RedisWorker consumer transport (RedisWorkerModule), the cross-process rate-limit store (RedisThrottlerModule, feature `throttler`), and the occurrence lock that fires a scheduled job once across replicas (RedisScheduleModule, feature `schedule`). The user-facing storage is Redis; apalis is an implementation detail."
keywords = ["framework", "nestrs", "redis", "queue", "apalis"]
categories = ["asynchronous", "database"]


[dependencies]
nest-rs-core.workspace = true
# The abstractions: `Job`, `ProcessMethod`, the `JobProducer` seam, the
# capabilities a backend declares, and (re-exported through it) the
# `#[processor]` macro. Application
# code reaches both this crate's Redis types AND the abstractions through
# the same import root by depending on `nest-rs-queue` + `nest-rs-redis`.
nest-rs-queue.workspace = true
# `RedisModule` owns `RedisConfig` (namespace `redis`, `NESTRS_REDIS__*`) and
# `RedisWorkerModule` owns `RedisWorkerConfig` (namespace `redis__worker`);
# `validator` backs their `#[validate]` rules.
nest-rs-config.workspace = true
validator.workspace = true
async-trait.workspace = true
anyhow.workspace = true
# Typed `RedisError` for the Redis backend (the producer surface speaks
# `nest_rs_queue::QueueError`); framework crates surface `thiserror`, not `anyhow`.
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# `limit`: `WorkerBuilderExt::concurrency` is how the consumer bounds a
# `#[process]` method to the `concurrency` it declares — apalis 0.7 keeps polling
# while its fetched batch is still running, so the fetch buffer alone bounds
# nothing. No `retry`: the retry budget is the queue port's, and an apalis retry
# layer would be a second one, counted where the method's is not.
apalis = { workspace = true, features = ["timeout", "catch-panic", "limit"] }
apalis-redis.workspace = true
# `throttler` feature only: the shared `dyn ThrottlerStore` seam + config types
# reused verbatim (the guard is transport-agnostic; only the backing store
# changes), running the atomic fixed-window Lua script over the shared
# `RedisConnection`.
nest-rs-throttler = { workspace = true, optional = true }
# `schedule` feature only: the `dyn OccurrenceLock` seam a job declared
# `replicas = "one"` claims its occurrences through, and the remedy sentence
# every lock binding shares.
nest-rs-schedule = { workspace = true, optional = true }
# The user-facing Redis surface (`redis::RedisError`, the `aio::ConnectionLike`
# `RedisConnection` implements, the command API a caller runs on it) is named
# through the `redis` crate directly — apalis-redis only re-exports these
# types, and the promise is "apalis types never leak". Unconditional: already
# in the tree via apalis-redis (same 0.32 workspace pin, so one connection
# type); the direct dep costs nothing.
redis = { workspace = true }
# `rediss://`: the process-default crypto provider `redis` builds its client
# with, installed when the app chose none; the client-certificate check run
# before anything is dialled; and the `rustls::Error` a refused handshake
# carries, which is not an outage and must not be retried as one.
rustls.workspace = true

[features]
# A second Redis use — a cross-process rate-limit store — as a feature on this
# one integration home, per the crate's future-expansion note. Off by default:
# producer/consumer apps that never rate-limit don't pull `nest-rs-throttler`.
throttler = ["dep:nest-rs-throttler"]
# The occurrence lock for scheduled jobs that fire once across replicas. Off by
# default for the same reason: an app with no such job pulls no scheduler.
schedule = ["dep:nest-rs-schedule"]

[dev-dependencies]
# A dead-lettered job that logs nothing passes every outcome assertion —
# `LogCapture` covers the event half of the worker's contract.
nest-rs-testing = { path = "../nest-rs-testing" }
# Self dev-dependency: turn on the `throttler` and `schedule` features for this
# crate's own test targets, so the `[[test]] e2e` target's `required-features`
# below are satisfied under `cargo nextest run --workspace -E 'binary(e2e)'`.
# Without it the live-Redis suite is skipped in silence rather than run.
# Dev-deps do not propagate, and a path-only dev-dep is stripped from the
# published manifest, so a producer-only consumer still pulls neither
# `nest-rs-throttler` nor `nest-rs-schedule`.
nest-rs-redis = { path = ".", features = ["throttler", "schedule"] }
nest-rs-core = { path = "../nest-rs-core" }
# The `#[processor]` macro emits `::nest_rs_worker::*` paths and the test
# implements `JobContext` directly.
nest-rs-worker = { path = "../nest-rs-worker" }
# Per-argument pipe on a `#[process]` job argument (`Piped<P, T>` / `Valid<T>`).
nest-rs-pipes = { path = "../nest-rs-pipes" }
# The live-Redis `e2e` binary names `Throttle`/`ThrottlerStore` to drive the
# `RedisThrottler` store directly. Path-only (intra-workspace dev-dep) and only
# built when the `throttler` feature is on — see the `[[test]]` below.
nest-rs-throttler = { path = "../nest-rs-throttler" }
# The live-Redis `e2e` binary declares `#[scheduled]` jobs and drives the
# `Scheduler` against `RedisOccurrenceLock`.
nest-rs-schedule = { path = "../nest-rs-schedule" }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tower.workspace = true
# The TLS server side the tests put in front of the client: the dev container's
# Redis speaks plaintext, so `rediss://` meets a rustls listener presenting the
# fixture certificates — the unit tests' refusing one, the e2e suite's proxy.
# Already in the tree through `redis`'s rustls support.
tokio-rustls.workspace = true

# The `e2e` binary exercises the `RedisThrottler` and the `RedisOccurrenceLock`,
# which only exist under their features — so the target is skipped entirely
# unless both are on (`cargo nextest run -p nest-rs-redis --features
# throttler,schedule -E 'binary(e2e)'`). `tests/integration/main.rs` stays
# auto-discovered.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["throttler", "schedule"]

[lints]
workspace = true
