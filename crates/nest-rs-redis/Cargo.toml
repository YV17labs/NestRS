[package]
name = "nest-rs-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Redis for nest-rs: one shared connection (RedisModule) to one Valkey server, Sentinel or a Cluster, and one binding per port over it, each a feature — the job queue on Redis Streams (RedisQueueModule, feature `queue`), the cross-process rate-limit store (RedisThrottlerModule, feature `throttler`), and the occurrence lock that fires a scheduled job once across replicas (RedisScheduleModule, feature `schedule`)."
keywords = ["framework", "nestrs", "redis", "queue", "streams"]
categories = ["asynchronous", "database"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


[dependencies]
nest-rs-core.workspace = true
# `queue` feature only: the port the queue binding implements — `Job`, the
# `JobProducer` and `JobConsumer` seams, the capabilities a backend declares.
nest-rs-queue = { workspace = true, optional = true }
# `RedisModule` owns `RedisConfig` (namespace `redis`, `<PREFIX>_REDIS__*`) and
# `RedisQueueModule` owns `RedisQueueConfig` (namespace `redis__queue`); `tls`
# is `ClientTls`, what every `rediss://` connection trusts and presents.
nest-rs-config = { workspace = true, features = ["tls"] }
async-trait.workspace = true
anyhow.workspace = true
# Typed `RedisError` for the Redis backend (the producer surface speaks
# `nest_rs_queue::QueueError`); framework crates surface `thiserror`, not `anyhow`.
thiserror.workspace = true
serde.workspace = true
# `queue` feature only: a job's envelope and a checkpoint, as stored.
serde_json = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# `throttler` feature only: the shared `dyn ThrottlerStore` seam + config types
# reused verbatim (the guard is transport-agnostic; only the backing store
# changes), running the atomic fixed-window Lua script over the shared
# `RedisConnection`.
nest-rs-throttler = { workspace = true, optional = true }
# `schedule` feature only: the `dyn OccurrenceLock` seam a job declared
# `replicas = "one"` claims its occurrences through, and the remedy sentence
# every lock binding shares.
nest-rs-schedule = { workspace = true, optional = true }
# The client every binding runs on, and the user-facing Redis surface
# (`redis::RedisError`, the `aio::ConnectionLike` `RedisConnection` implements,
# the command API a caller runs on it).
redis = { workspace = true }
# `queue` feature only: the scripts a producer or a worker caches at boot,
# loaded together — on a Cluster each load reaches every primary. `redis`
# already builds on it.
futures-util = { workspace = true, optional = true }
# `queue` feature only: each worker's consumer name in a queue's group, UUID v7,
# so a name also says when its worker started.
uuid = { workspace = true, optional = true }
# A Sentinel or Cluster URL names several hosts in its query, which only an
# RFC 3986 parser reads apart; `redis` parses with the same crate.
url.workspace = true
# `rediss://`: a host no certificate can name is refused as the handshake
# parses it, before anything is dialled.
rustls.workspace = true

[features]
# One feature per binding, named for the port it binds and read off its folder
# (`queue/`, `throttler/`, `schedule/`): each pulls a port crate an app using
# Redis for another port need not compile. None is on by default — the crate
# without one is the connection.
#
# The job queue on Redis Streams.
queue = ["dep:nest-rs-queue", "dep:futures-util", "dep:serde_json", "dep:uuid"]
# The cross-process rate-limit store.
throttler = ["dep:nest-rs-throttler"]
# The occurrence lock for scheduled jobs that fire once across replicas.
schedule = ["dep:nest-rs-schedule"]

[dev-dependencies]
# A dead-lettered job that logs nothing passes every outcome assertion —
# `LogCapture` covers the event half of the worker's contract; `queue` is the
# behaviour kit every queue backend runs.
nest-rs-testing = { path = "../nest-rs-testing", features = ["queue", "tls"] }
# Self dev-dependency: the suite runs with every binding on.
nest-rs-redis = { path = ".", features = ["queue", "throttler", "schedule"] }
nest-rs-core = { path = "../nest-rs-core" }
# The `#[processor]` macro emits `::nest_rs_worker::*` paths and the test
# implements `JobContext` directly.
nest-rs-worker = { path = "../nest-rs-worker" }
# Per-argument pipe on a `#[process]` job argument (`Piped<P, T>` / `Valid<T>`).
nest-rs-pipes = { path = "../nest-rs-pipes" }
# The suite drives the `RedisThrottler` store directly.
nest-rs-throttler = { path = "../nest-rs-throttler" }
# The suite declares `#[scheduled]` jobs against `RedisOccurrenceLock`.
nest-rs-schedule = { path = "../nest-rs-schedule" }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
# The suite reads `MONITOR` as a stream, to hold each documented ACL rule to
# the commands its binding sends.
# The TLS sides of the suites' doubles: a listener presenting the test
# authority's certificate, and the dial to Valkey behind it. Already in the
# tree through `redis`'s rustls support.
tokio-rustls.workspace = true

[lints]
workspace = true
