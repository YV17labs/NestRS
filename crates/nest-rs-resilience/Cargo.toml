[package]
name = "nest-rs-resilience"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Resilience for NestRS: #[resilient] runs a method calling a dependency under a named policy — a timeout per attempt, retries when it is idempotent, a circuit breaker read and switched by hand, a bulkhead and an outbound rate limit — answered 503 with Retry-After."
keywords = ["framework", "nestrs", "resilience", "circuit-breaker", "retry"]
categories = ["web-programming", "asynchronous"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true

[features]
# `ResilienceMiddleware`, a policy on the reqwest client an app builds itself;
# the umbrella's `reqwest` feature forwards it weakly.
reqwest = [
    "dep:reqwest",
    "dep:reqwest-middleware",
    "nest-rs-reqwest/middleware",
    "dep:http",
    "dep:async-trait",
]
# A breaker's transitions, counted on the meter `OpenTelemetry::init()`
# installs; the umbrella's `opentelemetry` feature forwards it weakly.
opentelemetry = ["dep:opentelemetry"]

[dependencies]
# `#[resilient]`, re-exported here: a method's body run under the policy a field
# of `self` holds.
nest-rs-resilience-macros.workspace = true
# `ResilienceModule` is a `Module` generic over its `Instance`; a policy waits
# through `WithinHeld`, core's bounded wait around a call it holds, and backs
# off through `Backoff`, and its refusal is a `Problem`.
nest-rs-core.workspace = true
# `ResilienceModule` owns its `#[config]` (`ResilienceConfig`, namespace
# `resilience`), read per instance from `<PREFIX>_RESILIENCE__*`.
nest-rs-config.workspace = true
# `ResilienceError`, the one error a policy answers.
thiserror.workspace = true
# The bulkhead's semaphores — its slots and its waiters' places — and the clock a
# breaker, a rate and a timeout read, and the timers a run waits on.
tokio.workspace = true
# The `CancellationToken` each attempt is handed, cancelled when it is given up.
tokio-util.workspace = true
# A breaker's transition is a `warn`; a retry, a wait and a refusal a `debug`, on
# `nest_rs::resilience`.
tracing.workspace = true
# The breaker's window and the rate's count — poison-free locking on every call
# a breaker admits and every attempt a rate counts.
parking_lot.workspace = true
# A run's futures, polled in place, each holding its call once; tokio and
# `nest-rs-core` already build it.
pin-project-lite.workspace = true
# The module's factory answers in the container's error channel, and the
# middleware hands its refusal to reqwest-middleware's `Error::Middleware`.
anyhow.workspace = true

# Public: `ResilienceMiddleware` implements reqwest-middleware's `Middleware`
# over reqwest's request and response, the words an app builds its client in.
reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
# The resend count each attempt hands the trace middleware beside it.
nest-rs-reqwest = { workspace = true, optional = true }
# The `Extensions` `Middleware::handle` takes.
http = { workspace = true, optional = true }
# `Middleware` is an `async_trait`.
async-trait = { workspace = true, optional = true }
# The API crate alone: a transition records on the global meter, which
# `OpenTelemetry::init()` installs and nothing else reads here.
opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` (not part of tokio's `full`) pauses time, so a breaker's open
# window and a backoff pass without the suite waiting them out.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# The composition witnesses boot the documented wiring; the middleware's suite
# sends real requests to a TLS double whose certificate a `TestAuthority`
# issued; a decorated subscription streams over the graphql-ws driver.
# Path-only intra-workspace dev edges, per the manifest rule.
nest-rs-testing = { path = "../nest-rs-testing", features = ["graphql", "http", "tls", "ws"] }
# Self dev-dependency: the suite runs with the middleware and the transitions'
# counter on.
nest-rs-resilience = { path = ".", features = ["reqwest", "opentelemetry"] }
# A route answering a policy's refusal: `#[controller]` and `#[routes]` expand
# into the guard and pipe chains each route runs.
nest-rs-http = { path = "../nest-rs-http" }
nest-rs-guards = { path = "../nest-rs-guards" }
nest-rs-pipes = { path = "../nest-rs-pipes" }
# The refusal's `503` on every edge and the queue's honouring its wait: a
# resolver, a gateway, an `#[mcp]` host and a processor, each answering it as an
# app's does. A crate defining a `#[resolver]` names `async_graphql::` itself.
# `resilience` keeps a decorated operation's `#[resilient]` on its own method,
# whose `self` holds the policy, where the field `#[operations]` generates holds
# none.
nest-rs-graphql = { path = "../nest-rs-graphql", features = ["resilience"] }
nest-rs-ws = { path = "../nest-rs-ws" }
nest-rs-mcp = { path = "../nest-rs-mcp" }
nest-rs-queue = { path = "../nest-rs-queue" }
# A decorated tick of a `#[scheduled]` block, run by the scheduler as an app's is.
nest-rs-schedule = { path = "../nest-rs-schedule" }
# A decorated listener of a `#[listeners]` block, called by the bus's emit.
nest-rs-events = { path = "../nest-rs-events" }
# A decorated indicator of an `#[indicators]` block, run by `HealthService::probe`.
nest-rs-health = { path = "../nest-rs-health" }
async-graphql.workspace = true
serde.workspace = true
serde_json.workspace = true
nest-rs-reqwest = { path = "../nest-rs-reqwest" }
http.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
# Pins `#[resilient]`'s compile-time copies against `ResilienceConfig`
# (tests/integration/config.rs): the `timeout` and `retries` ranges, over the
# literal a method writes, and the table of the settings no method pins, each
# refused naming the variable and the field that set it.
nest-rs-codegen = { path = "../nest-rs-codegen" }
syn.workspace = true
# The transitions' counter is read off an in-memory exporter the test installs
# as the global meter provider.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
