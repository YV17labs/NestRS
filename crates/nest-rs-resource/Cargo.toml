[package]
name = "nest-rs-resource"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Expose a SeaORM entity to REST/OpenAPI (wire DTO) from one declaration, via the #[expose] attribute; optional GraphQL surface with the `graphql` flag + feature."
keywords = ["framework", "nestrs", "seaorm", "crud", "graphql"]
categories = ["web-programming", "database"]

[features]
default = []
graphql = [
    "dep:async-graphql",
    "dep:nest-rs-graphql",
    "nest-rs-resource-macros/graphql",
]

[dependencies]
nest-rs-resource-macros.workspace = true
# `uuid` / `chrono`: `#[expose(…, graphql)]` re-emits the column's own type into
# the generated `InputObject`, and renders `DateTime*` columns on the output
# object — and an entity's columns are `Uuid` and `DateTime*` by construction.
# Those scalars' `InputType`/`OutputType` impls are therefore a requirement
# *this crate's macro* creates, declared here rather than left to the consumer,
# whose only signal was `the trait bound uuid::Uuid: InputType is not satisfied`
# pointing at a foreign-key field they never chose a type for.
async-graphql = { workspace = true, optional = true, features = ["uuid", "chrono"] }
nest-rs-graphql = { workspace = true, optional = true }
sea-orm.workspace = true
serde_json.workspace = true
# Re-exported so `#[expose]`'s generated derives route back here with a
# `crate = ` override. A real dependency, not a dev one: the consuming entity
# crate must NOT have to declare any of the three for code it never wrote.
serde.workspace = true
schemars.workspace = true
validator.workspace = true
chrono.workspace = true
uuid.workspace = true
# Re-exported for `#[expose]`-generated code (lifecycle impl, loader logs) so
# the consuming crate needs no direct dep on either.
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
# Path-only, never `.workspace = true`: `nest-rs-seaorm` depends back on this
# crate, so a versioned dev-edge would form a member cycle no publish order can
# satisfy. Cargo strips a versionless dev-dep from the published manifest.
nest-rs-seaorm = { path = "../nest-rs-seaorm" }
# Same path-only rule, and it does double duty: `#[expose(…, graphql)]` emits
# `::nest_rs_authz::` and `::nest_rs_core::` paths that resolve in the consuming
# crate, and this edge is what turns *this* crate's `graphql` feature on for its
# own test target — so the GraphQL fixture is compiled by a plain
# `cargo nextest run --workspace`, not only when some other member happens to
# unify the feature in.
nest-rs-authz = { path = "../nest-rs-authz", features = ["graphql"] }
nest-rs-core.workspace = true
sea-orm.workspace = true
uuid.workspace = true

[lints]
workspace = true
