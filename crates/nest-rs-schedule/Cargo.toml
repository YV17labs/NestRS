[package]
name = "nest-rs-schedule"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Discovered cron-style scheduled jobs for NestRS: the #[scheduled] decorator plus a ScheduleModule that auto-attaches the Scheduler."
keywords = ["framework", "nestrs", "cron", "scheduler", "jobs"]
categories = ["asynchronous"]


[dependencies]
nest-rs-core.workspace = true
nest-rs-worker.workspace = true
nest-rs-schedule-macros.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# `join_all`: an overrun asks its lock about every skipped occurrence at once.
futures-util.workspace = true
tracing.workspace = true
# `OccurrenceLockError`, the opaque failure a lock backend reports.
thiserror.workspace = true
croner = { workspace = true, features = ["jiff"] }
jiff.workspace = true
jiff-tzdb.workspace = true

[dev-dependencies]
# Raising SIGINT to exercise App::run's graceful-shutdown path end-to-end.
libc.workspace = true
# `LogCapture`: a schedule reports a job it could not settle by logging it and
# firing again, so the log *is* the outcome and only a capture can assert it.
nest-rs-testing = { path = "../nest-rs-testing" }
# `test-util` (not part of tokio's `full`) pauses time, so a lock that never
# answers is abandoned at its occurrence's stale threshold — most of a minute —
# without the suite waiting that minute out.
tokio = { workspace = true, features = ["test-util"] }
# Pins the decorators' compile-time copy of the `key` rule against the boot's
# (tests/integration/scheduler.rs).
nest-rs-codegen = { path = "../nest-rs-codegen" }

[lints]
workspace = true
