[package]
name = "nest-rs-seaorm-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal — the #[expose] and #[wire_enum] decorator macros (a SeaORM entity to its wire DTO, inputs and GraphQL object); re-exported by nest-rs-seaorm, not a direct dependency."
keywords = ["framework", "nestrs", "macros", "proc-macro", "seaorm"]
categories = ["development-tools::procedural-macro-helpers"]

[features]
graphql = []

[lib]
proc-macro = true

[dependencies]
# `extra-traits` supplies the `PartialEq`/`Eq`/`Debug` impls for `syn` types
# (`Path`, `Ident`) that `attr::RelationKind` derives. Workspace feature
# unification hides the need in a full build, but the crate must declare it to
# compile standalone (e.g. `cargo publish` verify, docs.rs).
syn = { workspace = true, features = ["extra-traits"] }
quote.workspace = true
proc-macro2.workspace = true
nest-rs-codegen.workspace = true

[lints]
workspace = true
