[package]
name = "nest-rs-seaorm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SeaORM for NestRS: the adapter that wraps sea-orm. `SeaOrmModule::for_root` opens the one pool (`NESTRS_SEAORM__*`); `SeaOrmDatabaseModule` binds the `nest-rs-database` port over it (`SeaOrmUnitOfWork`, the unit of work every edge runs through, and `Repo` on its ambient executor); `#[expose]` and `#[wire_enum]` make an entity its wire DTO, inputs and GraphQL object. The HTTP binding (`DbContext`, the route-model binder `Bind`) lives behind the `http` feature, so a headless app links no HTTP stack."
keywords = ["framework", "nestrs", "seaorm", "database", "orm"]
categories = ["database"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


[features]
default = []
# The HTTP binding: `DbContext`, the interceptor that runs each request as one
# unit of work, `Bind<S, A>` (the extractor that loads + authorizes through
# `CrudService::access`) and `#[crud]`'s error mapping. A headless app — a
# worker, a scheduler — leaves it off and links no HTTP stack.
# `nest-rs-authz/http` is forwarded because `src/http/shape.rs` uses
# `nest_rs_authz::http`.
http = [
    "dep:nest-rs-http",
    "dep:nest-rs-interceptors",
    "dep:poem",
    "nest-rs-authz/http",
]
# GraphQL transport extractors: the `bind` resolver helper, and what
# `#[expose(…, graphql)]` emits: the object derives, the relation bridges and
# their dataloaders.
# `nest-rs-authz/graphql` is forwarded because `src/graphql/bind.rs` refuses
# through `nest_rs_authz::graphql::forbidden`.
graphql = [
    "dep:nest-rs-graphql",
    "dep:async-graphql",
    "nest-rs-authz/graphql",
    "nest-rs-seaorm-macros/graphql",
]
# Liveness/readiness pool ping (`SeaOrmHealthIndicator`) wired through
# `nest-rs-health`'s `#[indicators]` registry. The connection's `ping`
# round-trips a `SELECT 1`, so an unreachable DB drops the readiness probe
# to `503`.
health = ["dep:nest-rs-health"]
# Convenience for tests and exemplars.
full = ["http", "graphql", "health"]

[dependencies]
nest-rs-core.workspace = true
# `#[expose]` and `#[wire_enum]`, re-exported at the root.
nest-rs-seaorm-macros.workspace = true
# The ORM-agnostic unit-of-work port: `SeaOrmUnitOfWork` implements
# `nest_rs_database::UnitOfWork`, which every edge opens its units through, and
# SeaORM's `Executor` enum implements `nest_rs_database::Executor`.
nest-rs-database.workspace = true
# `SeaOrmModule` owns the crate's one `#[config]`, `SeaOrmConfig` (namespace
# `seaorm`), loaded from `NESTRS_SEAORM__*`; `validator` backs its `#[validate]` rules.
# `tls`: the boot proof tells a refused TLS negotiation through `ClientTls`.
nest-rs-config = { workspace = true, features = ["tls"] }
# `validation_details` — the one redaction policy for `ValidationErrors` on a
# wire. `ServiceError::Validation` must inherit it, not restate it: a raw
# `to_value` echoes `params.value`, i.e. the rejected input.
nest-rs-pipes.workspace = true
validator.workspace = true
# `Repo` auto-applies the caller's row-level filter, read from the ambient
# `Ability` (`condition_for`); the ambient `Ability` itself lives in nest-rs-authz.
nest-rs-authz.workspace = true
sea-orm = { workspace = true, features = ["with-chrono"] }
# The pool's TLS backend, selected here because sea-orm cannot select it.
sqlx.workspace = true
chrono.workspace = true
# `PageParams` (the `?first&after` cursor query) derives `Deserialize` so the
# generated `#[crud]` list handler can read it with poem's `Query<…>`.
serde.workspace = true
# `ServiceError`'s RFC-9457 `problem+json` rendering serializes `validator`
# field errors into an `errors` extension member.
serde_json.workspace = true
# `PageParams` derives `JsonSchema` so the `#[crud]` list op's `Query<PageParams>`
# can advertise its `first`/`after` cursor as OpenAPI query parameters.
schemars.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# `#[expose(..., soft_delete)]` registers its entity here at link time, so
# every `Repo` read of it hides its tombstoned rows.
inventory.workspace = true
# `Bind` validates UUID v7 path ids, and an exposed entity's write DTO mints
# its `Uuid` primary key.
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The ambient executor is carried in a `tokio::task_local!`.
tokio.workspace = true
# A unit's settle runs on a task the driver tracks and drains before the pool
# closes, so a dropped edge future never cuts a `COMMIT`.
tokio-util.workspace = true

# Optional deps for transport-binding features.
# `uuid` / `chrono`: `#[expose(…, graphql)]` puts `Uuid` and `DateTime*` columns
# on GraphQL objects, so their scalar impls are this crate's requirement.
async-graphql = { workspace = true, optional = true, features = ["uuid", "chrono"] }
nest-rs-graphql = { workspace = true, optional = true }
nest-rs-health = { workspace = true, optional = true }
# Behind `http`: the request boundary that runs each request as one unit of
# work is an HTTP binding.
nest-rs-http = { workspace = true, optional = true }
nest-rs-interceptors = { workspace = true, optional = true }
poem = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency: the suite runs with every transport binding on.
nest-rs-seaorm = { path = ".", features = ["full"] }
# The pool's default statement bound is pinned below the HTTP edge's request
# deadline, and a doctest mounts a `#[crud]` controller.
nest-rs-http = { path = "../nest-rs-http" }
# The `public_visitor` e2e boots a real app: a `#[public]` controller behind
# `AbilityGuard`, driven through the in-process harness. `#[routes]` expands to
# `::nest_rs_guards::` paths, so a crate defining a controller owns that dep
# directly (same reason `nest-rs-authz`'s own edge tests do).
# `graphql` because the `federation` e2e writes a `#[resolver]`: `#[operations]`
# expands to the per-site guard chain, which this crate only exposes with the
# GraphQL edge compiled in.
nest-rs-guards = { path = "../nest-rs-guards" }
# Same reason one layer up: an `#[authorize]` operation's mask is
# `nest_rs_authz::graphql::masked_value_for`, behind authz's own `graphql`
# feature. A dev-dep, so no consumer of this crate gains it.
nest-rs-authz = { path = "../nest-rs-authz", features = ["graphql"] }
# `features = ["orm"]` so the framework workspace actually compiles
# `EphemeralDatabase` — the fixture that migrates against *this* crate.
# Without it nothing in the root workspace enables `nest-rs-testing/orm`, so
# `cargo clippy --workspace --all-targets` never saw those 176 published
# lines and only `demo/` (a separate workspace) built them. `tls` issues the
# certificate of the Postgres double the pool must refuse to log in to.
nest-rs-testing = { path = "../nest-rs-testing", features = ["http", "orm", "tls", "ws"] }
# The pool's default budget is pinned below the authentication guard's net.
nest-rs-authn = { path = "../nest-rs-authn" }
# The `executor` e2e emits under a caller's own transaction: the bus dispatches
# through this crate's `after_commit`, and only a live `BEGIN` makes a `Txn`.
nest-rs-events = { path = "../nest-rs-events" }
# The `ws` and `mcp` e2e boot a gateway and a tool host over the binding, which
# their edges open each message's and each operation's unit through.
nest-rs-ws = { path = "../nest-rs-ws" }
nest-rs-mcp = { path = "../nest-rs-mcp" }
# The `worker` e2e runs a `#[processor]` attempt over the binding, where the
# job's timeout meets its commit.
nest-rs-queue = { path = "../nest-rs-queue" }
# `test-util` (not part of tokio's `full`) pauses time, so the instant each
# conflicting call retries at is read off the clock its backoff sleeps on.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
