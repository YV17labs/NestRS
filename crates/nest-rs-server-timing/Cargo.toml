[package]
name = "nest-rs-server-timing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "W3C Server-Timing response header interceptor for NestRS apps (independent of OpenTelemetry)."
keywords = ["framework", "nestrs", "server-timing", "http", "metrics"]
categories = ["web-programming::http-server"]


[dependencies]
nest-rs-core.workspace = true
nest-rs-http.workspace = true
nest-rs-interceptors.workspace = true
poem.workspace = true
async-trait.workspace = true
# Per-request entry accumulator lock — poison-free locking.
parking_lot.workspace = true

# The composition witness boots an app and reads the header back off a route.
# `nest-rs-guards` is there because `#[routes]` expands into the per-route layer
# chain unconditionally — the dependency a *consumer* gets through the umbrella,
# and which a workspace crate names directly. Path-only intra-workspace dev
# edges, per the manifest rule.
[dev-dependencies]
nest-rs-guards = { path = "../nest-rs-guards" }
nest-rs-testing = { path = "../nest-rs-testing" }
tokio.workspace = true

[lints]
workspace = true
