[package]
name = "nest-rs-server-timing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "W3C Server-Timing response header interceptor for NestRS apps (independent of OpenTelemetry)."
keywords = ["framework", "nestrs", "server-timing", "http", "metrics"]
categories = ["web-programming::http-server"]


[dependencies]
nest-rs-core.workspace = true
# `ServerTimingModule` owns its `#[config]` `ServerTimingConfig` (namespace
# `server_timing`), loaded from `<PREFIX>_SERVER_TIMING__*`.
nest-rs-config.workspace = true
# The view a unit-stage interceptor reads the answer through.
nest-rs-http.workspace = true
# The mark an operation's refused guard stage leaves on the request around it.
nest-rs-guards.workspace = true
# Per-request entry accumulator lock — poison-free locking.
parking_lot.workspace = true
# One boot event when the header is turned on outside a development profile.
tracing.workspace = true

# The composition witness boots an app and reads the header back off a route.
# Path-only intra-workspace dev edges, per the manifest rule.
[dev-dependencies]
nest-rs-testing = { path = "../nest-rs-testing", features = ["http"] }
# A refusal answered inside a `200`, by a GraphQL field's or an MCP
# operation's guards, leaves its request untimed.
nest-rs-graphql = { path = "../nest-rs-graphql" }
nest-rs-mcp = { path = "../nest-rs-mcp" }
serde_json.workspace = true
tokio.workspace = true
# `figment::Jail` declares `<PREFIX>_ENV`, which the default reads off the
# process environment rather than a `ConfigService`.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
