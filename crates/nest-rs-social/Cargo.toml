[package]
name = "nest-rs-social"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Open social-login provider contract for NestRS: a flow-owning SocialProvider trait, inventory-based registry, and first-party GitHub/Google providers. Third-party providers plug in as independent crates through the same public seam."
keywords = ["framework", "nestrs", "oauth", "github", "google"]
categories = ["authentication", "web-programming"]


[dependencies]
nest-rs-core.workspace = true
nest-rs-authn.workspace = true
# Providers compose the shared Authorization-Code flow rather than each writing
# their own; `SocialProvider::authorize`/`exchange` default to it.
nest-rs-oauth-client.workspace = true
nest-rs-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
validator.workspace = true
anyhow.workspace = true

[dev-dependencies]
# `LogCapture`: an unconfigured provider is inert, and inert is indistinguishable
# from absent at every call site — the boot warn is the only trace.
nest-rs-testing = { path = "../nest-rs-testing" }
tokio = { workspace = true }

[lints]
workspace = true
