[package]
name = "nest-rs-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S3-compatible object storage for NestRS: a thin, injectable Storage client (presigned PUT/GET, head, byte and streamed read/write, prefix listing) built on the `object_store` crate. The AWS-S3 driver ships wired and runs against any S3-compatible server (AWS, MinIO, RustFS) in path- or virtual-host style; the GCS, Azure, fs and memory drivers sit behind the same client."
keywords = ["framework", "nestrs", "storage", "s3", "object-store"]
categories = ["web-programming", "filesystem"]

[dependencies]
nest-rs-core.workspace = true
# `StorageModule` owns its `#[config]` `StorageConfig` (namespace `storage`),
# loaded from `NESTRS_STORAGE__*`; `validator` backs its `#[validate]` rules.
nest-rs-config.workspace = true
validator.workspace = true
# The object-store abstraction. `aws` brings the `AmazonS3` driver, which
# implements both `ObjectStore` and the `Signer` trait used for presigning.
object_store.workspace = true
# `signed_url` takes a `reqwest::Method`, which is a re-export of `http::Method`
# (http 1.x). Depending on `http` directly keeps us decoupled from whichever
# reqwest minor object_store pins internally.
http.workspace = true
# `get_bytes` hands back `object_store`'s `Bytes` (Arc-backed, cheap clone) so a
# downloaded body is never copied on the way out.
bytes.workspace = true
# `get_stream`/`list` map `object_store`'s streams, mapping their errors into
# ours; `put_stream` consumes one.
futures-util.workspace = true
# One event: a multipart upload whose abort failed leaves billed parts behind,
# and the caller only gets the failure that caused it.
tracing.workspace = true
thiserror.workspace = true
# A cancelled `put_stream` is dropped mid-part, and `Drop` cannot await — so the
# abort is handed to a detached task on the runtime that was driving it.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The integration test signs a PUT, uploads raw bytes over HTTP, then reads
# them back — it needs an independent HTTP client.
reqwest.workspace = true
# Whether an interrupted multipart upload's parts were discarded is not
# observable through the store (`ListMultipartUploads` is not on
# `object_store`'s surface), so the e2e suite asserts on the event the client
# emits — which means collecting events with a `Layer` of its own.
tracing-subscriber.workspace = true
# `LogCapture`, for the unit half of the same problem: what the abort-on-drop
# guard says when it is dropped with no runtime to abort on.
nest-rs-testing = { path = "../nest-rs-testing" }
# `object_store::MultipartUpload` is an `#[async_trait]` trait, so a test double
# for it has to be written under the same attribute.
async-trait.workspace = true

[lints]
workspace = true
