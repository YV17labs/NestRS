[package]
name = "nest-rs-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-process testing harness for NestRS: boot an app's real DI graph and drive its HTTP/GraphQL/MCP surfaces with poem's TestClient, with provider overrides and no socket bound."
keywords = ["framework", "nestrs", "testing", "test", "harness"]
categories = ["development-tools::testing"]


[features]
# Satisfy the OpenTelemetryModule boot guard in tests (`with_test_telemetry`).
opentelemetry = ["dep:nest-rs-opentelemetry"]
# An ephemeral, migrated Postgres database fixture for e2e (`EphemeralDatabase`).
orm = ["dep:sea-orm", "dep:sea-orm-migration"]
# The graphql-ws subscription driver (`TestApp::graphql_socket`). Gated because a
# headless app's suite should not link a GraphQL schema to assert on a queue.
graphql = ["dep:nest-rs-graphql", "dep:async-graphql"]
# The WebSocket driver (`TestAppBuilder::build_ws`). Gated for `graphql`'s
# reason and one more: this is the only driver that binds a real port, so a
# suite that never opens a socket should not link a client or turn poem's
# non-default `websocket` feature on for the whole build.
ws = ["dep:tokio-tungstenite", "dep:futures-util", "dep:nest-rs-ws", "poem/websocket"]

[dependencies]
nest-rs-core.workspace = true
nest-rs-guards.workspace = true
nest-rs-http.workspace = true
nest-rs-interceptors.workspace = true
nest-rs-filters.workspace = true
nest-rs-exception-filters.workspace = true
anyhow.workspace = true
# `test` adds poem's in-process TestClient; `tower-compat` comes from the
# workspace default and is harmless here.
poem = { workspace = true, features = ["test"] }
# A headless app drives non-HTTP transports on a cancellable background task.
tokio.workspace = true
tokio-util.workspace = true
# Every e2e boot loads the project's `.env` via `load_project_env` — normal dep.
nest-rs-config.workspace = true
# Behind `graphql`: the subscription driver composes the app's schema and runs
# async-graphql's own graphql-ws engine over it. Optional so the harness stays
# GraphQL-free for a suite that has no schema.
nest-rs-graphql = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }
# The MCP helpers (`mcp::call_tool`) build JSON-RPC messages; no `nest-rs-mcp`
# dependency needed, the protocol is JSON over the `TestClient`.
serde_json.workspace = true
# `LogCapture` records what a transport *said* — the half of the contract a
# response assertion cannot reach (a silent denial, a missing dead-letter
# event, a warning filed under the wrong target).
tracing.workspace = true
tracing-subscriber.workspace = true
# Behind `ws`: a real WebSocket client. The upgrade, the lifetime ceiling and
# the writer task only exist above a socket, so unlike `GraphqlSocket` — which
# runs the protocol engine in process — this driver has to bind one. Already in
# the graph as poem's own websocket backend, so the feature adds no new crate.
tokio-tungstenite = { workspace = true, optional = true }
# `SinkExt`/`StreamExt` to drive that client.
futures-util = { workspace = true, optional = true }
# Behind `ws`: the port whose sockets this driver speaks to. `CloseCode` and
# the `{ event, data }` envelope are the gateway's own vocabulary, so they are
# read from it rather than re-spelled here — a copy of a wire grammar drifts
# silently, because nothing joins the two spellings.
nest-rs-ws = { workspace = true, optional = true }
# Opt-in fixtures: OpenTelemetry (boot guard) and a throwaway database for e2e.
nest-rs-opentelemetry = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }

[dev-dependencies]
# `transport_parity` boots one module serving both `Exempt`-edge transports to
# pin that they answer one app wiring identically. That is cross-crate wiring
# (guards' fallbacks × graphql × mcp), so it lives here rather than in any
# single surface crate — and dev-deps let it enable the two fallback features
# without them reaching a consumer of the harness.
# `ws` rides here too, not in `[dependencies]`: it is the `ws_gateway_guards`
# test that drives `GuardAsWsMessageCheck`, and `guards/ws` pulls `nest-rs-ws`
# and turns on `poem/websocket` — which a consumer asserting on a log line
# should not link, and which silently made this crate's own `ws` feature gate a
# no-op.
nest-rs-guards = { path = "../nest-rs-guards", features = ["graphql", "mcp", "ws"] }
nest-rs-mcp = { path = "../nest-rs-mcp" }
# `destructured_args` and `transport_parity` name `nest_rs_graphql` directly.
# Without this the suite compiles only under `--workspace`, where feature
# unification lends it `nest-rs-testing/graphql` from a crate two directories
# away — so `cargo check -p nest-rs-testing --tests` fails on its own.
nest-rs-graphql = { path = "../nest-rs-graphql" }
# `#[derive(SimpleObject)]` on the payload those two share.
async-graphql.workspace = true
tokio.workspace = true
# The config DI test boots a module wiring `ConfigModule::for_feature` and a
# service injecting the loaded config; `nest-rs-config` is already a normal
# dependency. `validator` backs the `#[config]` struct's `#[validate]` derive.
validator.workspace = true
# The pipes test (`tests/integration/pipes.rs`) needs the `GlobalPipe` trait + a
# `serde_json::Value` body to observe a pipe rewriting it.
nest-rs-pipes = { path = "../nest-rs-pipes" }
# The exception-filters test (`tests/integration/exception_filters.rs`) needs the
# trait + a typed error to throw and catch.
thiserror.workspace = true
async-trait.workspace = true
# `tests/integration/ws_gateway_guards.rs` drives a `#[gateway]` + `#[messages]`
# impl over `TestClient` — no socket, hence no `ws` feature — so it needs the
# macros and `WsModule` even when that feature is off.
nest-rs-ws = { path = "../nest-rs-ws" }
# `figment::Jail` isolates the real process env for the pinned-config override
# test (the deployment tier of the precedence rule), matching how
# `nest-rs-config` and `nest-rs-http` test env reads — no `unsafe set_var`.
figment = { workspace = true, features = ["test"] }
# The destructured-argument test covers all four transports against one app;
# `#[process]` is the fourth, so the queue contract + `#[queue]` macro come in
# dev-only (path-only, so publishing drags no test cycle).
nest-rs-queue = { path = "../nest-rs-queue" }
# The payload the four transports share derives `Serialize`/`Deserialize`, and
# an HTTP `Json` body needs `JsonSchema` for the OpenAPI document.
serde.workspace = true
schemars.workspace = true
