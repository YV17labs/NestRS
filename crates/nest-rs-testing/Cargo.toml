[package]
name = "nest-rs-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-process testing harness for NestRS: boot an app's real DI graph, headless or serving HTTP/GraphQL/MCP through its in-process TestClient (the `http` feature), with provider overrides and no socket bound."
keywords = ["framework", "nestrs", "testing", "test", "harness"]
categories = ["development-tools::testing"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


[features]
# The HTTP half: `TestApp`, which mounts the app's HTTP transport and drives it
# through the kit's `TestClient`, the `use_*_global` layer seams and the MCP
# helpers. A headless suite — a worker, a queue driver's kit — leaves it off
# and links no HTTP stack; it boots through `HeadlessApp::builder()`.
http = [
    "dep:nest-rs-http",
    "dep:nest-rs-guards",
    "dep:nest-rs-interceptors",
    "dep:nest-rs-filters",
    "dep:nest-rs-exception-filters",
    "dep:nest-rs-pipes",
    "dep:serde",
    "dep:url",
]
# Satisfy the OpenTelemetryModule boot guard in tests (`with_test_telemetry`).
opentelemetry = ["dep:nest-rs-opentelemetry"]
# An ephemeral, migrated Postgres database fixture for e2e (`EphemeralDatabase`),
# opening its connections through the app pool's own options.
orm = ["dep:nest-rs-seaorm", "dep:sea-orm", "dep:sea-orm-migration"]
# The graphql-ws subscription driver (`TestApp::graphql_socket`). Gated because a
# headless app's suite should not link a GraphQL schema to assert on a queue.
graphql = ["http", "dep:nest-rs-graphql", "dep:async-graphql"]
# The WebSocket driver (`TestAppBuilder::build_ws`). Gated for `graphql`'s
# reason and one more: this is the only driver that binds a real port, so a
# suite that never opens a socket should not link a client.
ws = ["http", "dep:tokio-tungstenite", "dep:futures-util", "dep:nest-rs-ws"]
# The queue backend kit (`queue_kit!`): the behaviour a queue backend owes the
# port's worker, as tests a driver runs against its own implementation. tokio's
# `test-util` (not part of `full`) is what pauses time under a backend running
# in process.
queue = ["dep:nest-rs-queue", "dep:serde", "tokio/test-util"]
# A test certificate authority (`TestAuthority`): the certificates a TLS test
# presents or trusts, issued in process rather than committed, and the
# handshakes a double accepts with them and dials a service with; and the
# `ClientTls` a framework client trusting the authority holds.
tls = ["dep:rcgen", "dep:rustls", "dep:tokio-rustls", "nest-rs-config/tls"]

[dependencies]
nest-rs-core.workspace = true
anyhow.workspace = true
# Behind `http`: the transport `TestApp` mounts, and the layer crates its
# `use_*_global` seams register into.
nest-rs-http = { workspace = true, optional = true }
nest-rs-guards = { workspace = true, optional = true }
nest-rs-interceptors = { workspace = true, optional = true }
nest-rs-filters = { workspace = true, optional = true }
nest-rs-exception-filters = { workspace = true, optional = true }
nest-rs-pipes = { workspace = true, optional = true }
# Behind `http`: the client's query and form bodies are form-encoded through
# rust-url's `form_urlencoded`, the WHATWG encoder `nest-rs-config` already
# links, so it adds no crate to the graph.
url = { workspace = true, optional = true }
# A headless app drives non-HTTP transports on a cancellable background task.
tokio.workspace = true
tokio-util.workspace = true
# Every e2e boot loads the project's `.env` via `load_project_env` — normal dep.
nest-rs-config.workspace = true
# Behind `tls`.
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
# Behind `graphql`: the subscription driver composes the app's schema and runs
# async-graphql's own graphql-ws engine over it. Optional so the harness stays
# GraphQL-free for a suite that has no schema.
nest-rs-graphql = { workspace = true, optional = true }
async-graphql = { workspace = true, optional = true }
# The MCP helpers (`mcp::call_tool`) build JSON-RPC messages; no `nest-rs-mcp`
# dependency needed, the protocol is JSON over the `TestClient`.
serde_json.workspace = true
# `LogCapture` records what a transport *said* — the half of the contract a
# response assertion cannot reach (a silent denial, a missing dead-letter
# event, a warning filed under the wrong target).
tracing.workspace = true
tracing-subscriber.workspace = true
# Behind `ws`: a real WebSocket client. The upgrade, the lifetime ceiling and
# the writer task only exist above a socket, so unlike `GraphqlSocket` — which
# runs the protocol engine in process — this driver has to bind one. Already in
# the graph as the WebSocket edge's own backend, so the feature adds no new
# crate.
tokio-tungstenite = { workspace = true, optional = true }
# `SinkExt`/`StreamExt` to drive that client.
futures-util = { workspace = true, optional = true }
# Behind `ws`: the port whose sockets this driver speaks to. `CloseCode` and
# the `{ event, data }` envelope are the gateway's own vocabulary, so they are
# read from it rather than re-spelled here — a copy of a wire grammar drifts
# silently, because nothing joins the two spellings.
nest-rs-ws = { workspace = true, optional = true }
# Behind `queue`: the port the kit runs its cases through. `serde` is the
# kit's job's derives, and the HTTP client's `body_json`, `form` and
# `assert_json`.
nest-rs-queue = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# Opt-in fixtures: OpenTelemetry (boot guard) and a throwaway database for e2e.
nest-rs-opentelemetry = { workspace = true, optional = true }
# Behind `orm`: `SeaOrmConfig::connect_options`, the one constructor of a
# Postgres connection, so the fixture verifies TLS as the app's pool does. It
# also selects the pool's TLS backend. `nest-rs-seaorm` dev-depends on this
# crate with `orm`; cargo allows that cycle, and its test binaries link one
# copy of it.
nest-rs-seaorm = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency: the suite boots `TestApp` and proves the fixture against
# a TLS double, so it runs with the HTTP harness, `EphemeralDatabase` and
# `TestAuthority` on whatever features a caller builds with, `guard_markers`
# opens a real socket (`build_ws`), and `graphql` drives a subscription
# (`graphql_socket`).
nest-rs-testing = { path = ".", features = ["graphql", "http", "orm", "tls", "ws"] }
# `transport_parity` boots one module serving both in-band endpoints to pin
# that they answer one app wiring identically. That is cross-crate wiring (the
# global pool × graphql × mcp), so it lives here rather than in any single
# surface crate.
nest-rs-mcp = { path = "../nest-rs-mcp" }
# `destructured_args` and `transport_parity` name `nest_rs_graphql` directly.
# Without this the suite compiles only under `--workspace`, where feature
# unification lends it `nest-rs-testing/graphql` from a crate two directories
# away — so `cargo check -p nest-rs-testing --tests` fails on its own.
nest-rs-graphql = { path = "../nest-rs-graphql" }
# `#[derive(SimpleObject)]` on the payload those two share.
async-graphql.workspace = true
# The suites' handlers, interceptors, filters and exception filters still
# answer poem's types until the HTTP edge's contracts leave it; the client
# names none of them.
poem.workspace = true
# `test-util` (not part of tokio's `full`) pauses time, so the close of a
# transport that unwinds for seconds is asserted on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }
# The config DI test boots a module wiring `ConfigModule::for_feature` and a
# service injecting the loaded config; `nest-rs-config` is already a normal
# dependency. `validator` backs the `#[config]` struct's `#[validate]` derive.
validator.workspace = true
# The exception-filters test (`tests/integration/exception_filters.rs`) needs the
# trait + a typed error to throw and catch.
thiserror.workspace = true
async-trait.workspace = true
# `tests/integration/ws_gateway_guards.rs` and `guard_markers.rs` declare a
# `#[gateway]` + `#[messages]` impl, so the suite names the macros and
# `WsModule` itself rather than through the `ws` feature.
nest-rs-ws = { path = "../nest-rs-ws" }
# `figment::Jail` isolates the real process env for the pinned-config override
# test (the deployment tier of the precedence rule), matching how
# `nest-rs-config` and `nest-rs-http` test env reads — no `unsafe set_var`.
figment = { workspace = true, features = ["test"] }
# The destructured-argument test covers all four transports against one app;
# `#[process]` is the fourth, so the queue contract + `#[queue]` macro come in
# dev-only (path-only, so publishing drags no test cycle).
nest-rs-queue = { path = "../nest-rs-queue" }
# The payload the four transports share derives `Serialize`/`Deserialize`, and
# an HTTP `Json` body needs `JsonSchema` for the OpenAPI document.
serde.workspace = true
schemars.workspace = true
# `shutdown.rs` sums the way down from every crate that bounds a step of it —
# each transport's window, the telemetry flush — so it reads their constants
# whatever features this crate is built with. Behind a feature, the sum was a
# test the Definition-of-done run never compiled, and raising any constant
# passed the whole suite. Path-only, so publishing drags none of them.
nest-rs-opentelemetry = { path = "../nest-rs-opentelemetry" }
nest-rs-schedule = { path = "../nest-rs-schedule" }
# `setups.rs` imports every first-party `for_root` twice, so it reaches every
# crate shipping one. Path-only, so publishing drags none of them.
nest-rs-authn = { path = "../nest-rs-authn" }
nest-rs-health = { path = "../nest-rs-health" }
nest-rs-oauth-client = { path = "../nest-rs-oauth-client" }
nest-rs-oauth-resource = { path = "../nest-rs-oauth-resource" }
nest-rs-openapi = { path = "../nest-rs-openapi" }
nest-rs-redis = { path = "../nest-rs-redis", features = ["queue"] }
nest-rs-server-timing = { path = "../nest-rs-server-timing" }
nest-rs-static-files = { path = "../nest-rs-static-files" }
nest-rs-storage = { path = "../nest-rs-storage" }
nest-rs-throttler = { path = "../nest-rs-throttler" }

[lints]
workspace = true
