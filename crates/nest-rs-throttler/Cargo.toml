[package]
name = "nest-rs-throttler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rate limiting for NestRS: a ThrottlerGuard reading a #[meta(Throttle)] override, over a fixed-window counter behind a pluggable ThrottlerStore trait."
keywords = ["framework", "nestrs", "rate-limit", "throttle", "middleware"]
categories = ["web-programming"]

[dependencies]
# `ThrottlerGuard` is `#[injectable]`; `ThrottlerModule` is a `DynamicModule`.
nest-rs-core.workspace = true
# `ThrottlerStoreError`, the error channel of `ThrottlerStore::hit`.
thiserror.workspace = true
# `ThrottlerModule` owns its `#[config]` (`ThrottlerConfig`, namespace `throttler`),
# loaded from `<PREFIX>_THROTTLER__*`.
nest-rs-config.workspace = true
# `ThrottlerGuard` plugs into the Layer System (RateLimit category).
nest-rs-guards.workspace = true
# The guard's HTTP entry reads the request through the edge's view: the client
# address and the route the router matched.
nest-rs-http.workspace = true
async-trait.workspace = true
# A `429` denial is a security event — logged at `warn` on the `nest_rs::throttler` target.
tracing.workspace = true
# Window-map lock — poison-free locking on the rate-limit hot path.
parking_lot.workspace = true
# `ThrottlerModule::for_root` provides the throttler through the factory phase,
# whose error channel is anyhow (the container's `Result`).
anyhow.workspace = true
# HMAC-SHA256 of each bucket's subject before a store outside the process sees
# it — already in every build through rustls.
aws-lc-rs.workspace = true


[dev-dependencies]
# The guard's unit tests hand it a request with a peer address, which only
# poem's request carries until the HTTP edge moves onto its own vocabulary.
poem.workspace = true
# The wiring suite boots a real app: `#[routes]` wraps each verb in poem's own
# `#[handler]`, and a rate-limited controller is the shape the docs describe.
# `test-util` (not part of tokio's `full`) pauses time, so a store that never
# answers is denied at `HIT_TIMEOUT` without the suite waiting those seconds out.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
nest-rs-interceptors = { path = "../nest-rs-interceptors" }
# The scope half of the guard's contract is only observable in a status code:
# `guard.rs` boots the documented global wiring and counts requests against a
# route's own `#[meta(Throttle)]`; `ws` drives a gateway over a real socket, the
# one way to see a refused message's frame. Path-only (intra-workspace
# dev-edge), per the manifest rule.
nest-rs-testing = { path = "../nest-rs-testing", features = ["ws"] }
# The per-edge suites declare the real thing rather than calling a check by
# hand: a `#[resolver]`, an `#[mcp]` host and a `#[gateway]`, each binding the
# guard where a developer would and answering through each real transport. That
# is also the only witness the guard's `GuardFor` declarations have — an
# undeclared binding is a compile error at the `#[use_guards]` line.
# Path-only (intra-workspace dev-edge), per the manifest rule.
nest-rs-graphql = { path = "../nest-rs-graphql" }
nest-rs-mcp = { path = "../nest-rs-mcp" }
nest-rs-ws = { path = "../nest-rs-ws" }
# A crate defining a `#[resolver]` needs `async-graphql` as a direct dep: the
# generated `#[Object]` names `async_graphql::` paths at the call site.
async-graphql.workspace = true
serde_json.workspace = true

[lints]
workspace = true
