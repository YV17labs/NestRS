[package]
name = "nest-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "NestRS framework umbrella — re-exports the core and the surface crates an app reaches for, with a `prelude` for the common case."
keywords = ["framework", "nestrs", "web", "backend", "async"]
categories = ["web-programming", "asynchronous"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


##
## Capability features — the install contract.
##
## Enabling a capability MUST pull everything its decorators' expansions name
## unconditionally, or the developer meets `E0433` inside a macro expansion —
## the defect this matrix exists to prevent. Emissions that depend on an
## attribute the developer writes themselves (`#[authorize]` → authz,
## `#[crud]` → seaorm) are their own feature: one more feature, never one more
## dependency line. Each is a row of codegen's crate table naming its
## attribute, and a `__requires_<feature>` pair in `src/lib.rs` that turns a
## missing feature into a sentence naming it.
##
## `dep?/feat` (weak) forwards a binding only when both sides are already on —
## an HTTP-only build never compiles the GraphQL stack through those edges.
## `dep/feat` (strong) also enables the optional dep, which is what a capability
## wants for a crate its expansion always names.
##
## Adding an unconditional path to a macro without adding it here is how the
## matrix drifts. `nest-rs-macro-hygiene` is the compile-time witness.
##
[features]
default = ["http", "config"]

# Everything, for someone who does not want to pick yet — the `tokio = { features
# = ["full"] }` of this framework. Compile time and dependency tree grow with it;
# narrow to the capabilities you use whenever you like, the imports do not move.
#
# **Every capability but `testing`, which is the one deliberately left out.**
# `nest-rs-testing` is a `--dev` install — its own docs page and README say
# `cargo add --dev nest-rs --features testing` — so folding it in here would put
# a test harness in every release binary of anyone who took the undecided
# default. Asymmetry argued, not silent: a reader who reaches for `TestApp`
# under `full` and does not find it is meeting a decision, not a hole.
full = [
    "http", "config", "database", "seaorm", "graphql", "ws", "mcp", "queue",
    "redis", "redis-queue", "redis-throttler", "redis-schedule",
    "schedule", "events", "authn", "authz",
    "oauth-client", "oauth-server", "oauth-resource", "social", "opentelemetry",
    "openapi", "health", "throttler", "server-timing", "guards", "pipes",
    "storage", "static-files", "reqwest",
]

# `#[controller]` / `#[routes]` expand to the per-route layer chain — guard
# specs, pipe folds, and the interceptor and exception-filter sites core's
# pipeline runs — all unconditional, none of them a crate the developer names.
# `nest-rs-testing?/http` is the harness's HTTP half (`TestApp`): a suite
# beside `testing` reaches it, and a headless one without `http` boots through
# `HeadlessApp::builder()` and links no HTTP stack.
http = [
    "dep:nest-rs-http",
    "guards",
    "pipes",
    "nest-rs-seaorm?/http",
    "nest-rs-authz?/http",
    "nest-rs-testing?/http",
]
# `pipes`: a config's custom rule, or its hand-written `Validate`, names
# `nest_rs::pipes::validator`, which costs a config-only build a crate of pure
# transforms on what it links already.
config = ["dep:nest-rs-config", "pipes"]
# Beside `testing`, the harness runs a unit of work through the app's binding
# (`system_unit`).
database = ["dep:nest-rs-database", "nest-rs-testing?/database"]
# `#[expose]` is seaorm's own decorator.
# `nest-rs-testing?/orm` carries `EphemeralDatabase`: a suite that tests against
# a real schema needs it, and "which extra feature turns the fixture on" is not
# a question the app should have to answer.
# `authz` is not optional here even though `#[authorize]` is: `#[crud]` writes
# an `#[authorize(::nest_rs_authz::<marker>, Entity)]` on *every* operation it
# generates and an `::nest_rs_authz::Action` on each one that loads a row, and
# `#[expose]` judges every wire row through `nest_rs_authz` where it builds it,
# whether or not the developer writes a posture attribute. `nest-rs-seaorm`
# depends on the crate already, so the feature carries what the expansion names
# and costs no compilation. `pipes` the same way: `nest-rs-seaorm` links it, and a
# column's custom rule names `nest_rs::pipes::validator`.
seaorm = [
    "dep:nest-rs-seaorm",
    "database",
    "authz",
    "pipes",
    "nest-rs-testing?/orm",
]
# `#[resolver]` names the guard chain and the pipe fold unconditionally
# (`resolver.rs`), so `graphql` owns them rather than inheriting them from a
# feature the developer might not enable.
# `authz` is the developer's, as on every edge: `#[operations]` emits
# `::nest_rs_authz` — the class gate, the subscription's pushed rows — only for an
# operation carrying `#[authorize]` (a `#[public]` one names none), and
# `#[expose(..., graphql)]` rides `seaorm`, which enables it. A GraphQL gateway
# with no database compiles no sea-orm; a decorator whose `#[authorize]` needs
# the feature says so (`__requires_authz`). `#[wire_enum(graphql)]` is core's and
# reaches this crate by its key alone, so a build without the feature says so too
# (`__requires_graphql`).
graphql = [
    "dep:nest-rs-graphql",
    "http",
    "nest-rs-testing?/graphql",
    "nest-rs-seaorm?/graphql",
    "nest-rs-authz?/graphql",
]
# `#[messages]` names the per-message chain the gateway runs and binds each
# guard on `GuardFor<WsView>`. The gateway reuses the HTTP guards at the upgrade,
# so authz's `http` binding is what runs there; `nest-rs-authz/ws` is the
# separate per-message half `#[messages]` emits from an
# `#[authorize(Action, Entity)]` — the message's reads it opens, beside the class
# gate every edge shares. Both, because a gateway needs the upgrade chain *and* the
# posture.
ws = [
    "dep:nest-rs-ws",
    "http",
    "nest-rs-testing?/ws",
    "nest-rs-authz?/http",
    "nest-rs-authz?/ws",
]
# `#[mcp]` mounts through `HttpEndpointMeta`: the transport runs the global pool
# and the endpoint's guards at its request, and each operation's chain runs the
# pool again.
mcp = [
    "dep:nest-rs-mcp",
    "http",
    "nest-rs-authz?/mcp",
]
# `#[processor]` folds pipes over the job payload, which is no crate a
# `#[process]` method names.
# A port forwards its kit weakly: beside `testing`, a queue driver's suite
# reaches `queue_kit!` with no second manifest line, and a build without
# `testing` compiles no harness.
queue = [
    "dep:nest-rs-queue",
    "pipes",
    "nest-rs-testing?/queue",
    # Beside `seaorm`, the database binding keeps the outbox a push inside a
    # transaction is written to, with no import of the app's.
    "nest-rs-seaorm?/queue",
]
# The one Redis connection (`RedisModule`, `RedisConnection`) and nothing else:
# an app that sends its own commands compiles no port. Beside `health`, each
# instance `RedisModule` opens attaches its own indicator.
redis = ["dep:nest-rs-redis"]
# `redis-<port>`: one feature per binding of `nest-rs-redis`, read off its
# folder, each closing over the port it binds, whose module the developer's own
# code names. Never a feature named for a use (`redis-cache`). A binding the
# umbrella does not forward exists in no umbrella build, short of the second
# manifest line the umbrella forbids.
#
# The job queue on Redis Streams (`RedisQueueModule`).
redis-queue = ["redis", "queue", "nest-rs-redis/queue"]
# The cross-process rate-limit store (`RedisThrottlerModule`).
redis-throttler = ["redis", "throttler", "nest-rs-redis/throttler"]
# The occurrence lock a `replicas = "one"` job claims through
# (`RedisScheduleModule`).
redis-schedule = ["redis", "schedule", "nest-rs-redis/schedule"]
# A scheduled method's `TransactionPolicy` is the database port's, a crate
# `nest-rs-schedule` links already.
schedule = ["dep:nest-rs-schedule", "database"]
events = ["dep:nest-rs-events"]
# `Strategy::authenticate` takes a `nest_rs::http::Request` and a custom
# strategy's neighbouring guard names `nest_rs::guards` — both are types the
# developer has to *write*, so the capability closes over `http` (which brings
# `guards`) the way every other capability row does. Without it the extension
# point the docs teach cannot be spelled, and the error is an unresolved import
# at their `use`.
# Beside `testing`, the harness signs the bearers an app verifies with a key of
# the test's own (`ephemeral_signing_key`, `bearer`).
authn = ["dep:nest-rs-authn", "http", "nest-rs-testing?/authn"]
# The OAuth 2.0 *client* role: obtaining a token from somebody else's
# authorization server. Its transaction cookie is `JwtService`-signed, hence
# `authn`.
oauth-client = ["dep:nest-rs-oauth-client", "authn"]
# The OAuth 2.0 *authorization server* role: RFC 6749 §5.1's access token
# response, §5.2's token-endpoint error set and §2.3 client authentication.
# `ClientAuthenticationGuard<S>` runs the app's own authn `Strategy`, which the
# developer writes with `AuthError` and `basic_credentials`, so the capability
# closes over `authn` (which brings `http`) as `oauth-client` does.
oauth-server = ["dep:nest-rs-oauth-server", "authn"]
# RFC 9728 discovery. Mounts a controller and an interceptor, so `http`; the
# boot check reads `AuthnConfig`, so `authn`.
oauth-resource = ["dep:nest-rs-oauth-resource", "authn", "http"]
# The `#[authorize]` half: the developer writes the attribute, so they enable
# the feature named after it. Transport bindings ride the transport features.
# A rule's scope is a `nest_rs::guards::Scope` the developer declares, so
# `guards`. Beside `testing`, the harness runs a unit of work under an ability
# (`unit`).
authz = ["dep:nest-rs-authz", "guards", "nest-rs-testing?/authz"]
social = ["dep:nest-rs-social", "authn", "oauth-client"]
opentelemetry = ["dep:nest-rs-opentelemetry"]
# The trace and the client telemetry on the reqwest client an app builds itself:
# no HTTP stack of the framework's, and no exporter — a request records through
# whatever `opentelemetry` installs, and carries its `traceparent` without it.
reqwest = ["dep:nest-rs-reqwest"]
openapi = ["dep:nest-rs-openapi", "http"]
# A resource the framework opens ships its indicator in its own crate, behind
# a `health` feature forwarded weakly here: beside `seaorm`, `redis` or
# `storage`, the module opening the resource attaches it, so `HealthModule`
# checks every resource the app opened; without `health`, none compiles.
health = [
    "dep:nest-rs-health",
    "http",
    "nest-rs-seaorm?/health",
    "nest-rs-redis?/health",
    "nest-rs-storage?/health",
]
# HTTP only: `ThrottlerGuard` checks every edge through one `check`, and
# declares it once for every view, so no edge's feature reaches it.
throttler = ["dep:nest-rs-throttler", "http"]
server-timing = ["dep:nest-rs-server-timing", "http"]
# Mounts as the HTTP router's fallback; `#[derive(Embed)]` resolves through
# `nest_rs::static_files::rust_embed`, so an embedded source needs no line of its own.
static-files = ["dep:nest-rs-static-files", "http"]
# `tls` carries `TestAuthority`, the certificates a TLS test double presents:
# test-only like the rest, so always on here.
testing = ["dep:nest-rs-testing", "nest-rs-testing/tls"]
# The layer contracts an edge's decorators name. Writing a custom `Guard` (the
# mandated authz posture) or `Pipe` should not force a direct per-crate dep;
# `Interceptor` and `ExceptionFilter` are core's, so they take no feature.
# Capability features above depend on these by name, which is what makes a bare
# `features = ["http"]` sufficient.
guards = ["dep:nest-rs-guards"]
pipes = ["dep:nest-rs-pipes"]
storage = ["dep:nest-rs-storage"]

