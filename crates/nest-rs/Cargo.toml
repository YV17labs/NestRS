[package]
name = "nest-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "NestRS framework umbrella — re-exports the core and the surface crates an app reaches for, with a `prelude` for the common case."
keywords = ["framework", "nestrs", "web", "backend", "async"]
categories = ["web-programming", "asynchronous"]

# docs.rs builds default features only, so a feature-gated item, and every
# link naming it, would be missing from the published page. The CI rustdoc
# gate builds the same set: `cargo doc --workspace --all-features`.
[package.metadata.docs.rs]
all-features = true


##
## Capability features — the install contract.
##
## Enabling a capability MUST pull everything its decorators' expansions name
## unconditionally, or the developer meets `E0433` inside a macro expansion —
## the defect this matrix exists to prevent. Emissions that depend on an
## attribute the developer writes themselves (`#[authorize]` → authz,
## `#[crud]` → seaorm) are their own feature: one more feature, never one more
## dependency line.
##
## `dep?/feat` (weak) forwards a binding only when both sides are already on —
## an HTTP-only build never compiles the GraphQL stack through those edges.
## `dep/feat` (strong) also enables the optional dep, which is what a capability
## wants for a crate its expansion always names.
##
## Adding an unconditional path to a macro without adding it here is how the
## matrix drifts. `nest-rs-macro-hygiene` is the compile-time witness.
##
[features]
default = ["http", "config"]

# Everything, for someone who does not want to pick yet — the `tokio = { features
# = ["full"] }` of this framework. Compile time and dependency tree grow with it;
# narrow to the capabilities you use whenever you like, the imports do not move.
#
# **Every capability but `testing`, which is the one deliberately left out.**
# `nest-rs-testing` is a `--dev` install — its own docs page and README say
# `cargo add --dev nest-rs --features testing` — so folding it in here would put
# a test harness in every release binary of anyone who took the undecided
# default. Asymmetry argued, not silent: a reader who reaches for `TestApp`
# under `full` and does not find it is meeting a decision, not a hole.
full = [
    "http", "config", "database", "seaorm", "graphql", "ws", "mcp", "queue",
    "redis", "redis-queue", "redis-throttler", "redis-schedule",
    "schedule", "events", "authn", "authz",
    "oauth-client", "oauth-server", "oauth-resource", "social", "opentelemetry",
    "openapi", "health", "throttler", "server-timing", "guards", "pipes",
    "interceptors", "filters", "exception-filters", "worker",
    "storage", "static-files",
]

# `#[controller]` / `#[routes]` expand to the per-route Layer System chain —
# guard specs, pipe folds, interceptor/filter/exception-filter sites — all
# unconditional, none of them a crate the developer names.
http = [
    "dep:nest-rs-http",
    "guards",
    "pipes",
    "interceptors",
    "filters",
    "exception-filters",
    "nest-rs-seaorm?/http",
    "nest-rs-authz?/http",
]
config = ["dep:nest-rs-config"]
database = ["dep:nest-rs-database"]
# `#[expose]` and `#[wire_enum]` are seaorm's own decorators.
# `nest-rs-testing?/orm` carries `EphemeralDatabase`: a suite that tests against
# a real schema needs it, and "which extra feature turns the fixture on" is not
# a question the app should have to answer.
# `authz` is not optional here even though `#[authorize]` is: `#[crud]` emits
# `::nest_rs_authz::http::Authorize<::nest_rs_authz::Read, _>` and an
# `::nest_rs_authz::Action` on *every* operation it generates, and `#[expose]`
# implements `::nest_rs_authz::WireModelDefaults` on every entity, whether or
# not the developer writes a posture attribute. `nest-rs-seaorm` already depends
# on the crate, so it was compiled and only the umbrella's `pub use` was gated out —
# `cargo add nest-rs --features http,seaorm` + `#[crud]` was
# `E0433: cannot find `authz` in `nest_rs``, blamed on the attribute. That is the
# defect this matrix exists to prevent, so the feature carries what the
# expansion names.
seaorm = [
    "dep:nest-rs-seaorm",
    "database",
    "authz",
    "nest-rs-testing?/orm",
]
# `#[resolver]` names the guard chain and the pipe fold unconditionally
# (`resolver.rs`), so `graphql` owns them rather than inheriting them from a
# feature the developer might not enable.
# `authz` is strong, not `?`: a GraphQL posture is **mandatory**, so
# `#[operations]` emits `::nest_rs_authz::graphql::{authorize, masked_value_for}`
# on every operation it expands, and `#[expose(..., graphql)]` emits
# `::nest_rs_authz::masked_output_ambient` in the relation loader. Under the weak
# form the crate stayed off and `::nest_rs::authz` did not resolve.
graphql = [
    "dep:nest-rs-graphql",
    "http",
    "authz",
    "nest-rs-guards/graphql",
    "nest-rs-testing?/graphql",
    "nest-rs-seaorm?/graphql",
    "nest-rs-authz?/graphql",
    "nest-rs-throttler?/graphql",
]
# `#[messages]` names `GuardAsWsMessageCheck` and the per-message chain runner,
# both behind guards' `ws`. The gateway reuses the HTTP guards at the upgrade, so
# authz's `http` binding is what runs there; `nest-rs-authz/ws` is the separate
# per-message half `#[messages]` emits from an `#[authorize(Action, Entity)]` —
# the class gate and the reply mask. Both, because a gateway needs the upgrade
# chain *and* the posture.
ws = [
    "dep:nest-rs-ws",
    "http",
    "nest-rs-guards/ws",
    "nest-rs-testing?/ws",
    "nest-rs-seaorm?/ws",
    "nest-rs-authz?/http",
    "nest-rs-authz?/ws",
    "nest-rs-throttler?/ws",
]
# `#[mcp]` mounts through `HttpEndpointMeta` and resolves its operation guard
# against the global pool, which guards' `mcp` feature seeds.
mcp = [
    "dep:nest-rs-mcp",
    "http",
    "nest-rs-guards/mcp",
    "nest-rs-seaorm?/mcp",
    "nest-rs-authz?/mcp",
    "nest-rs-throttler?/mcp",
]
# `#[processor]` folds pipes over the job payload and reaches the worker-context
# seam; neither is a crate a `#[process]` method names.
queue = ["dep:nest-rs-queue", "worker", "pipes"]
# The one Redis connection (`RedisModule`, `RedisConnection`) and nothing else:
# an app that sends its own commands, or a health check, compiles no port.
redis = ["dep:nest-rs-redis"]
# `redis-<port>`: one feature per binding of `nest-rs-redis`, read off its
# folder, each closing over the port it binds — the binding is imported beside
# that port's module, which the developer's own code names. Never a feature
# named for a use (`redis-cache`). A binding the umbrella does not forward
# exists in no umbrella build, short of the second manifest line the umbrella
# forbids.
#
# The job queue on Redis Streams (`RedisQueueModule`).
redis-queue = ["redis", "queue", "nest-rs-redis/queue"]
# The cross-process rate-limit store (`RedisThrottlerModule`).
redis-throttler = ["redis", "throttler", "nest-rs-redis/throttler"]
# The occurrence lock a `replicas = "one"` job claims through
# (`RedisScheduleModule`).
redis-schedule = ["redis", "schedule", "nest-rs-redis/schedule"]
schedule = ["dep:nest-rs-schedule"]
events = ["dep:nest-rs-events"]
# `Strategy::authenticate` takes a `poem::Request` and a custom strategy's
# neighbouring guard names `nest_rs::guards` — both are types the developer has
# to *write*, so the capability closes over `http` (which brings `guards`) the
# way every other capability row does. Without it the extension point the docs
# teach cannot be spelled, and the error is an unresolved import at their `use`.
authn = ["dep:nest-rs-authn", "http"]
# The OAuth 2.0 *client* role: obtaining a token from somebody else's
# authorization server. Its transaction cookie is `JwtService`-signed, hence
# `authn`.
oauth-client = ["dep:nest-rs-oauth-client", "authn"]
# The OAuth 2.0 *authorization server* role: RFC 6749 §5.1's access token
# response, §5.2's token-endpoint error set and §2.3.1 client authentication.
# Both bodies render themselves as poem responses, and `TokenError` marks its
# own `NoBearerChallenge`, so the capability closes over `http` (which brings
# `guards`) the way every other request-shaped row does.
oauth-server = ["dep:nest-rs-oauth-server", "http"]
# RFC 9728 discovery. Mounts a controller and an interceptor, so `http`; the
# boot check reads `AuthnConfig`, so `authn`.
oauth-resource = ["dep:nest-rs-oauth-resource", "authn", "http"]
# The `#[authorize]` half: the developer writes the attribute, so they enable
# the feature named after it. Transport bindings ride the transport features.
authz = ["dep:nest-rs-authz"]
social = ["dep:nest-rs-social", "authn", "oauth-client"]
# Same shape: the `with_test_telemetry` boot guard lives behind testing's
# `opentelemetry` feature.
opentelemetry = ["dep:nest-rs-opentelemetry", "nest-rs-testing?/opentelemetry"]
openapi = ["dep:nest-rs-openapi", "http"]
health = ["dep:nest-rs-health", "http", "nest-rs-seaorm?/health"]
# HTTP only, deliberately: `ThrottlerGuard` checks all four request-carrying
# edges, and each of the other three rides its own transport feature above
# (`nest-rs-throttler?/graphql`, `?/ws`, `?/mcp`) — weakly, so this stays the
# one dependency an HTTP-only app pays for.
throttler = ["dep:nest-rs-throttler", "http"]
server-timing = ["dep:nest-rs-server-timing", "http"]
# Mounts as the HTTP router's fallback; `#[derive(Embed)]` resolves through
# `nest_rs::static_files::rust_embed`, so an embedded source needs no line of its own.
static-files = ["dep:nest-rs-static-files", "http"]
testing = ["dep:nest-rs-testing"]
# Layer-System extension-point crates. Writing a custom `Guard` (the mandated
# authz posture), `Pipe`, `Interceptor`, `Filter` or `ExceptionFilter` — or a
# worker provider — should not force a direct per-crate dep.
# Capability features above depend on these by name, which is what makes a bare
# `features = ["http"]` sufficient.
guards = ["dep:nest-rs-guards"]
pipes = ["dep:nest-rs-pipes"]
interceptors = ["dep:nest-rs-interceptors"]
filters = ["dep:nest-rs-filters"]
exception-filters = ["dep:nest-rs-exception-filters"]
worker = ["dep:nest-rs-worker"]
storage = ["dep:nest-rs-storage"]

[dependencies]
nest-rs-core.workspace = true

nest-rs-http = { workspace = true, optional = true }
nest-rs-config = { workspace = true, optional = true }
nest-rs-database = { workspace = true, optional = true }
nest-rs-seaorm = { workspace = true, optional = true }
nest-rs-graphql = { workspace = true, optional = true }
nest-rs-ws = { workspace = true, optional = true }
nest-rs-mcp = { workspace = true, optional = true }
nest-rs-queue = { workspace = true, optional = true }
nest-rs-redis = { workspace = true, optional = true }
nest-rs-schedule = { workspace = true, optional = true }
nest-rs-events = { workspace = true, optional = true }
nest-rs-authn = { workspace = true, optional = true }
nest-rs-authz = { workspace = true, optional = true }
nest-rs-oauth-client = { workspace = true, optional = true }
nest-rs-oauth-server = { workspace = true, optional = true }
nest-rs-oauth-resource = { workspace = true, optional = true }
nest-rs-social = { workspace = true, optional = true }
nest-rs-opentelemetry = { workspace = true, optional = true }
nest-rs-openapi = { workspace = true, optional = true }
nest-rs-health = { workspace = true, optional = true }
nest-rs-throttler = { workspace = true, optional = true }
nest-rs-server-timing = { workspace = true, optional = true }
nest-rs-static-files = { workspace = true, optional = true }
nest-rs-testing = { workspace = true, optional = true }
nest-rs-guards = { workspace = true, optional = true }
nest-rs-pipes = { workspace = true, optional = true }
nest-rs-interceptors = { workspace = true, optional = true }
nest-rs-filters = { workspace = true, optional = true }
nest-rs-exception-filters = { workspace = true, optional = true }
nest-rs-worker = { workspace = true, optional = true }
nest-rs-storage = { workspace = true, optional = true }

[lints]
workspace = true
