[workspace]
resolver = "2"
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
version = "7.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/YV17labs/NestRS"
homepage = "https://nestrs.dev"

[workspace.dependencies]
nest-rs = { path = "../crates/nest-rs", features = ["http", "config", "database", "seaorm", "graphql", "ws", "mcp", "queue", "redis", "redis-throttler", "redis-schedule", "schedule", "events", "authn", "authz", "oauth-client", "oauth-server", "oauth-resource", "social", "opentelemetry", "openapi", "health", "throttler", "server-timing", "testing", "guards", "pipes", "interceptors", "filters", "exception-filters", "worker", "storage"] }

tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
poem = { version = "3.1", features = ["tower-compat", "anyhow", "compression", "multipart", "sse"] }
bytes = "1.12"
futures-util = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
async-graphql = { version = "=7.2.1", features = ["dataloader"] }
validator = { version = "0.21", features = ["derive"] }
uuid = { version = "1.27", features = ["v7", "serde"] }
sea-orm = { version = "=2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "=2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2", features = ["uuid1"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-tungstenite = "0.30"

features = { path = "crates/features" }
migrations = { path = "crates/migrations" }

[workspace.lints.clippy]
needless_update = "allow"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
self_named_module_files = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
