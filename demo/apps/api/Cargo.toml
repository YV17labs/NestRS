[package]
name = "api"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
nest-rs.workspace = true
features.workspace = true
poem.workspace = true
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
sea-orm.workspace = true
serde_json.workspace = true

[dev-dependencies]
nest-rs.workspace = true
# Enables `features::testing` (dev keypair, org id, token minting) for e2e.
features = { workspace = true, features = ["test-support"] }
poem = { workspace = true, features = ["test"] }
migrations = { workspace = true }
# The audio-storage e2e boots a worker to drain the `audio` queue and talks to
# real RustFS directly: `nest-rs-storage` builds the client that ensures the
# bucket, `reqwest` PUTs to / GETs from the presigned URLs the api mints.
reqwest = { workspace = true }
# The subscription e2e drives a real graphql-ws socket against a bound server —
# the one half `TestClient` cannot reach, since it runs the endpoint in-process
# with no connection to upgrade.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
