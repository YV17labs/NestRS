input CreateOrg {
	name: String!
}

input CreateUser {
	email: String!
	name: String!
}

"""
Implement the DateTime<FixedOffset> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

type Mutation {
	createOrg(input: CreateOrg!): Org!
	createUser(input: CreateUser!): User!
	deleteOrg(id: ID!): Boolean!
	deleteUser(id: ID!): Boolean!
	publishPost(id: ID!): Post!
	updateOrg(id: ID!, input: UpdateOrg!): Org
	updateUser(id: ID!, input: UpdateUser!): User
}

type Org {
	createdAt: DateTime!
	id: ID!
	name: String!
	posts(after: String, first: Int): PostConnection!
	updatedAt: DateTime!
	users(after: String, first: Int): UserConnection!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
}

type Post {
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	author: User
	authorId: ID!
	body: String!
	createdAt: DateTime!
	id: ID!
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	org: Org
	orgId: ID!
	status: PostStatus!
	title: String!
	updatedAt: DateTime!
}

type PostConnection {
	"""
	A list of edges.
	"""
	edges: [PostEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Post!]!
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type PostEdge {
	"""
	A cursor for use in pagination
	"""
	cursor: String!
	"""
	The item at the end of the edge
	"""
	node: Post!
}

enum PostStatus {
	DRAFT
	PUBLISHED
}

type Query {
	org(id: ID!): Org
	orgs(after: String, first: Int): [Org!]!
	post(id: ID!): Post
	posts(after: String, first: Int): [Post!]!
	user(id: ID!): User
	users(after: String, first: Int): [User!]!
}

type Subscription {
	postPublished: Post!
}

input UpdateOrg {
	name: String!
}

input UpdateUser {
	email: String!
	name: String!
}

type User {
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	createdAt: DateTime
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	email: String
	id: ID!
	name: String!
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	org: Org
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	orgId: ID
	posts(after: String, first: Int): PostConnection!
	"""
	Field-level authorization applies: reads `null` where the caller's ability withholds it.
	"""
	updatedAt: DateTime
}

type UserConnection {
	"""
	A list of edges.
	"""
	edges: [UserEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [User!]!
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type UserEdge {
	"""
	A cursor for use in pagination
	"""
	cursor: String!
	"""
	The item at the end of the edge
	"""
	node: User!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
