{{- include "demo.validate" . -}}
{{- range $app, $_ := .Values.apps }}
{{- $cfg := fromYaml (include "demo.appConfig" (dict "ctx" $ "app" $app)) }}
{{- if eq $cfg.kind "deployment" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "demo.fullname" $) $app }}
  labels:
    {{- include "demo.appLabels" (dict "ctx" $ "app" $app) | nindent 4 }}
spec:
  {{- if not (or $cfg.autoscaling.enabled $cfg.keda.enabled) }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "demo.appSelectorLabels" (dict "ctx" $ "app" $app) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the configuration changes — an env var only reaches
        # a process at start, so a ConfigMap edit is otherwise invisible.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if not $.Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "demo.appSelectorLabels" (dict "ctx" $ "app" $app) | nindent 8 }}
        {{- with $cfg.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "demo.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $cfg.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $app }}
          image: {{ include "demo.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # One image, every binary. This line is the whole difference between
          # the five Deployments.
          command:
            - {{ printf "/usr/local/bin/%s" $cfg.bin | quote }}
          securityContext:
            {{- toYaml $cfg.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          env:
            {{- include "demo.env" (dict "ctx" $ "app" $app) | nindent 12 }}
          envFrom:
            {{- include "demo.envFrom" (dict "ctx" $ "app" $app) | nindent 12 }}
          {{- include "demo.probes" $ | nindent 10 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
      {{- with $cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
