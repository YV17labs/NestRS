{{/*
Queue depth, through KEDA. Optional: the chart installs and runs without KEDA in
the cluster, and every app leaves this off by default.

Why this exists at all when `autoscaling` above is simpler: a replica runs at
most each `#[process]` method's `concurrency` attempts at once, and both demo
processors spend them waiting on storage or the database, so CPU utilisation
stays flat however deep the backlog gets. Stream length is the only signal that
moves with the work.
*/}}
{{- range $app, $_ := .Values.apps }}
{{- $cfg := fromYaml (include "demo.appConfig" (dict "ctx" $ "app" $app)) }}
{{- if and (eq $cfg.kind "deployment") $cfg.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-%s" (include "demo.fullname" $) $app }}
  labels:
    {{- include "demo.appLabels" (dict "ctx" $ "app" $app) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" (include "demo.fullname" $) $app }}
  pollingInterval: {{ $cfg.keda.pollingInterval }}
  cooldownPeriod: {{ $cfg.keda.cooldownPeriod }}
  minReplicaCount: {{ $cfg.keda.minReplicaCount }}
  maxReplicaCount: {{ $cfg.keda.maxReplicaCount }}
  {{- with $cfg.keda.behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  triggers:
    {{- $redis := $.Values.keda.redis }}
    {{- range $cfg.keda.triggers }}
    {{- if eq .type "redis-streams" }}
    {{- /* KEDA has a scaler per Valkey topology: the one the app's URL declares. */}}
    - type: {{ get (dict "standalone" "redis-streams" "sentinel" "redis-sentinel-streams" "cluster" "redis-cluster-streams") $redis.topology }}
      metadata:
        {{- if eq $redis.topology "standalone" }}
        {{- if not (or (index .metadata "address") (index .metadata "addressFromEnv") (index .metadata "host")) }}
        address: {{ $redis.address | quote }}
        {{- end }}
        {{- else }}
        {{- if not $redis.addresses }}
        {{- fail (printf "keda.redis.addresses names the %s's hosts, comma-separated host:port" $redis.topology) }}
        {{- end }}
        addresses: {{ $redis.addresses | quote }}
        {{- end }}
        {{- if eq $redis.topology "sentinel" }}
        {{- if not $redis.sentinelMaster }}
        {{- fail "keda.redis.sentinelMaster is the URL's sentinelServiceName" }}
        {{- end }}
        sentinelMaster: {{ $redis.sentinelMaster | quote }}
        {{- with $redis.sentinelUsernameFromEnv }}
        sentinelUsernameFromEnv: {{ . | quote }}
        {{- end }}
        {{- with $redis.sentinelPasswordFromEnv }}
        sentinelPasswordFromEnv: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with $redis.usernameFromEnv }}
        usernameFromEnv: {{ . | quote }}
        {{- end }}
        {{- with $redis.passwordFromEnv }}
        passwordFromEnv: {{ . | quote }}
        {{- end }}
        enableTLS: {{ $redis.enableTLS | quote }}
        {{- if eq $redis.topology "cluster" }}
        {{- if ne (int $redis.databaseIndex) 0 }}
        {{- fail "KEDA's cluster scaler reads database 0 alone: keep the queues there (keda.redis.databaseIndex: 0)" }}
        {{- end }}
        {{- else }}
        databaseIndex: {{ $redis.databaseIndex | quote }}
        {{- end }}
        {{- toYaml .metadata | nindent 8 }}
    {{- else }}
    - type: {{ .type }}
      metadata:
        {{- toYaml .metadata | nindent 8 }}
    {{- end }}
      {{- with .authenticationRef }}
      authenticationRef:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
