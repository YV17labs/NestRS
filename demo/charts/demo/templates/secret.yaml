{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo.secretName" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if ne $key (include "demo.issuerKey" $) }}
  {{ printf "%s_%s" $.Values.envPrefix $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- with (index .Values.secrets (include "demo.issuerKey" .)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo.issuerSecretName" $ }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ printf "%s_%s" $.Values.envPrefix (include "demo.issuerKey" $) }}: {{ . | quote }}
{{- end }}
{{- end }}
