{{/*
One Secret per deployment, holding only the keys of `secrets` that app reads
(`demo.appSecrets`); a job's is a hook of its own (`job.yaml`).
*/}}
{{- range $app, $_ := .Values.apps }}
{{- $cfg := fromYaml (include "demo.appConfig" (dict "ctx" $ "app" $app)) }}
{{- $data := fromYaml (include "demo.appSecrets" (dict "ctx" $ "app" $app)) }}
{{- if and (eq $cfg.kind "deployment") $data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo.appSecretName" (dict "ctx" $ "app" $app) }}
  labels:
    {{- include "demo.appLabels" (dict "ctx" $ "app" $app) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ printf "%s_%s" $.Values.envPrefix $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
