{{- range $app, $_ := .Values.apps }}
{{- $cfg := fromYaml (include "demo.appConfig" (dict "ctx" $ "app" $app)) }}
{{- if eq $cfg.kind "deployment" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "demo.fullname" $) $app }}
  labels:
    {{- include "demo.appLabels" (dict "ctx" $ "app" $app) | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "demo.appSelectorLabels" (dict "ctx" $ "app" $app) | nindent 4 }}
{{- end }}
{{- end }}
