# The NestRS demo, on Kubernetes.
#
# One image holds every binary of the demo workspace (see demo/Dockerfile), so
# an app is a Deployment whose `command` names its binary. Everything below is
# either that map (`apps`), what all of them share (`defaults`), or the
# configuration the framework reads from the environment.

# --- image --------------------------------------------------------------------
image:
  repository: ghcr.io/yv17labs/nestrs
  # Empty ⇒ the chart's appVersion. Pin a digest or an immutable tag in prod.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- configuration ------------------------------------------------------------
# The framework reads its settings from the environment. `.env` is a local
# development convenience the image does not carry: real environment variables
# win over it anyway, so a cluster only ever sets variables.

# The prefix every framework variable wears. Set on the process (here, as a pod
# env var) because it chooses the cascade before any file is read — never in a
# `.env`. Renaming it renames every key below at once.
envPrefix: NESTRS

# `NESTRS_ENV` — selects the environment-specific half of the cascade.
environment: production

# Scheme used to build the public origins the apps advertise to each other.
scheme: https

# Non-secret settings, written into a ConfigMap. Keys are spelled WITHOUT the
# prefix; the chart prepends `envPrefix`. Anything set here, under its name or as
# `<KEY>_FILE`, wins over the values the chart derives from the app hostnames (see
# `templates/_helpers.tpl`).
config:
  STORAGE__URL: s3://nestrs
  STORAGE__REGION: us-east-1
  STORAGE__FORCE_PATH_STYLE: "true"
  # `text` or `json`. A production process already defaults to json; stated
  # because a log shipper reads it and nobody should have to know the profile.
  LOG_FORMAT: json

# Secret settings, each written into the Secret of every app whose `reads` names it
# (below), and of no other: an app holds only what it reads, so `auth`'s signing key
# and registered clients reach `auth` alone. Same spelling rule as `config`. A key no
# app reads refuses the render rather than going nowhere; an app with its own
# `existingSecret` reads that Secret alone.
#
# Required (here, or in the `existingSecret` of each app reading it), each refused at
# install when nothing the chart renders hands it to an app that reads it:
#   SEAORM__URL              postgres://user:pass@host:5432/db — every app, `migrate` too
#   REDIS__URL               rediss://host:6379 — api, assistant, worker
#   REDIS__TRANSCODES__URL   rediss://cache:6379 — api, assistant, worker: the audio
#                            feature's records, each expiring on its own; a server
#                            evicting them is never REDIS__URL's, whose schedule needs
#                            `noeviction`
#   STORAGE__ACCESS_KEY      the object store's access key id — api, assistant, worker
#   STORAGE__SECRET_KEY      and its secret
#   AUTHN__PUBLIC_KEY        PEM, Ed25519 — api, assistant, auth, live
#   AUTHN__PRIVATE_KEY       its private half — auth alone; generate your own, never the
#                            repo's. `auth` boots without it, its token endpoint
#                            answering 500, so the chart refuses that too
#   OAUTH__SERVER__CLIENTS   JSON array, the clients `auth`'s token endpoint
#                            registers — auth alone
# Also required, under `apps`: the `host` of `api`, `assistant`, `auth` and `live`, from
# which the chart derives the URLs the apps name each other by and the audience each
# one requires (see `host` below).
#
# Optional, `auth` alone: SOCIAL__GITHUB__CLIENT_ID / __CLIENT_SECRET, SOCIAL__GOOGLE__*.
# A provider is on once `auth` is handed both, here, in `config` or in its own
# `config` or `extraEnv`, each under its name or as `<KEY>_FILE`, the chart deriving
# its redirect from `apps.auth.host`; one half alone refuses the render. An id in
# `auth`'s `existingSecret`, which the chart does not read, takes
# SOCIAL__<PROVIDER>__REDIRECT_URL in `config` too.
secrets: {}

# --- shared pod settings ------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    enabled: true
    # Empty ⇒ one secret per exposed app, named <release>-<app>-tls.
    secretName: ""

# Merged under every entry of `apps`; an app's own value wins.
defaults:
  # `deployment` — a long-running process behind a Service.
  # `job`        — runs once before the deployments, as a pre-install/pre-upgrade
  #                hook. Ordering comes from the hook, not from this map: Helm
  #                renders the entries in alphabetical order.
  kind: deployment
  replicas: 1
  # A Secret of yours this app reads in place of the one the chart writes for it from
  # `secrets`; set here, every app reads the same one, each key you put in it included.
  existingSecret: ""
  # The settings this app reads that a deployment hands it: `required` ones refuse
  # the render when nothing the chart renders for the app carries them, `optional`
  # ones are only routed. A key of `secrets` reaches exactly the apps naming it here.
  reads: {}
  # `kind: job` only. `hookWeight` orders the jobs among themselves; every one of
  # them runs before the deployments either way.
  args: []
  backoffLimit: 1
  hookWeight: -5
  # The runtime image is distroless nonroot (UID 65532) with no shell.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Serves on while the endpoint removal propagates; 0 renders no preStop.
  shutdownDelaySeconds: 5
  # Holds the delay plus the framework's 29.5s way down; the chart refuses less.
  terminationGracePeriodSeconds: 35
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Unprefixed, so `RUST_LOG` (the console's filter, `info` when unset;
  # `info,nest_rs::operation=off` silences every edge's one line per unit of
  # work), `OTEL_EXPORTER_OTLP_ENDPOINT` and the other `OTEL_*` go here.
  extraEnv: []
  pdb:
    enabled: false
    minAvailable: 1
  # Plain HPA — CPU/memory. Never scales below 1.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    # Empty ⇒ no memory metric.
    targetMemoryUtilizationPercentage: ""
    behavior: {}
  # KEDA — queue depth. Mutually exclusive with `autoscaling` on the same app
  # (KEDA owns an HPA of its own; two of them fight). The chart fails the render
  # if both are enabled.
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 20
    cooldownPeriod: 300
    behavior: {}
    triggers: []

# --- the apps -----------------------------------------------------------------
# Every binary the image carries is declared here; `kind` says what shape it
# takes in the cluster.
#
# `bin`  the binary in /usr/local/bin this app runs
# `port` the HTTP port (deployments only); the chart sets NESTRS_HTTP__PORT from
#        it, so this value is authoritative and the code default is only a
#        local-run convenience
# `host` public hostname. Also what the chart derives the cross-app URLs from
#        (issuer, each app's own audience, the assistant's resource, the
#        resources a sign-in may name, the redirect of each social provider whose
#        client id it reads) — set them rather than copying those URLs into `config`
#        by hand. `api`, `auth` and `live` refuse a boot with no issuer (`auth`'s
#        `host`) or no audience of their own (theirs: an app kept off the Ingress
#        pins its `AUTHN__AUDIENCE` in its own `config`), `auth` one with no
#        resource, `assistant` one with no resource of its own or no issuer.
# `config` this app's own settings, spelled like the top-level `config` and laid
#        over it for this app alone — what `apps/<app>/.env` holds locally
# `reads` what the app's modules load from a deployment, read off its `module.rs`:
#        add a key here when your own module reads one, and its secret reaches it
apps:
  # Schema migrations. An app like any other — the same image, another binary —
  # that runs to completion before any deployment is updated.
  migrate:
    kind: job
    bin: migrate
    args:
      - up
    reads:
      SEAORM__URL: required

  api:
    bin: api
    port: 3002
    host: ""
    ingress: true
    config:
      # The api compresses its own responses, as it does in a local run.
      HTTP__COMPRESSION: "true"
    reads:
      SEAORM__URL: required
      REDIS__URL: required
      REDIS__TRANSCODES__URL: required
      STORAGE__URL: required
      STORAGE__ACCESS_KEY: required
      STORAGE__SECRET_KEY: required
      AUTHN__PUBLIC_KEY: required
      AUTHN__ISSUER: required
      AUTHN__AUDIENCE: required

  auth:
    bin: auth
    port: 3001
    host: ""
    ingress: true
    reads:
      SEAORM__URL: required
      AUTHN__PUBLIC_KEY: required
      AUTHN__PRIVATE_KEY: required
      AUTHN__ISSUER: required
      AUTHN__AUDIENCE: required
      OAUTH__SERVER__CLIENTS: required
      SIGN_IN__RESOURCES: required
      SOCIAL__GITHUB__CLIENT_ID: optional
      SOCIAL__GITHUB__CLIENT_SECRET: optional
      SOCIAL__GOOGLE__CLIENT_ID: optional
      SOCIAL__GOOGLE__CLIENT_SECRET: optional

  assistant:
    bin: assistant
    port: 3003
    host: ""
    ingress: true
    reads:
      SEAORM__URL: required
      REDIS__URL: required
      REDIS__TRANSCODES__URL: required
      STORAGE__URL: required
      STORAGE__ACCESS_KEY: required
      STORAGE__SECRET_KEY: required
      AUTHN__PUBLIC_KEY: required
      OAUTH__RESOURCE__RESOURCE: required
      OAUTH__RESOURCE__AUTHORIZATION_SERVERS: required

  live:
    bin: live
    port: 3004
    host: ""
    ingress: true
    reads:
      SEAORM__URL: required
      AUTHN__PUBLIC_KEY: required
      AUTHN__ISSUER: required
      AUTHN__AUDIENCE: required
    # WebSocket. Sockets live up to NESTRS_WS__MAX_CONNECTION_SECS (4h by
    # default), so a rollout closes them and clients reconnect — CPU is a poor
    # signal for a connection-bound edge, hence no autoscaling here by default.

  worker:
    bin: worker
    # Health only — the worker mounts an HTTP transport for the probes.
    port: 3005
    host: ""
    ingress: false
    reads:
      SEAORM__URL: required
      REDIS__URL: required
      REDIS__TRANSCODES__URL: required
      STORAGE__URL: required
      STORAGE__ACCESS_KEY: required
      STORAGE__SECRET_KEY: required
    # Two facts about this worker, both from the framework's own source:
    #
    # 1. A `#[process]` method runs as many jobs at once as its `concurrency`
    #    declares, in each replica — four transcodes, one notification write —
    #    and throughput past that comes from replicas. Both demo jobs are pure
    #    I/O (an S3 round-trip, one INSERT), so a pod draining a huge backlog
    #    sits near 0% CPU and a CPU-driven HPA never fires. Turn `autoscaling`
    #    on only if your own processor is genuinely CPU-bound.
    # 2. A scale-up never moves a peer's jobs: a job changes hands only once
    #    the lease of the worker holding it lapsed. The queue is still
    #    at-least-once, so a handler stays idempotent.
    autoscaling:
      enabled: false
    # Queue depth, the signal that actually reflects a backlog. Needs KEDA in
    # the cluster. `minReplicaCount: 1` on purpose — see `keda.redis` below.
    # A trigger's `streamLength` is the backlog one replica is sized for, so it
    # moves with the method's `concurrency`: a replica runs four transcodes at
    # once, and 20 on the stream is the same five per running transcode that 5
    # was when it ran one.
    keda:
      enabled: false
      minReplicaCount: 1
      maxReplicaCount: 10
      pollingInterval: 20
      cooldownPeriod: 300
      triggers:
        - type: redis-streams
          metadata:
            stream: "nestrs:queue:{audio}:jobs"
            streamLength: "20"
        - type: redis-streams
          metadata:
            stream: "nestrs:queue:{notifications}:jobs"
            streamLength: "20"

# --- KEDA ---------------------------------------------------------------------
# KEDA connects to Redis itself, from the operator — not through the app's env.
# Its scaler wants `host:port`, not the `rediss://` URL the framework reads, and
# speaks TLS when `enableTLS` says so, as Valkey does here.
#
# Why minReplicaCount defaults to 1 rather than 0: a job held back — a retry
# waiting for its backoff, a delayed push — waits on
# `nestrs:queue:{<queue>}:due`, which the trigger does not read, and only a
# running worker files it on the stream the trigger reads. With no worker
# running, a retry therefore waits for the next push to wake the deployment.
# Every demo job retries. Set it to 0 knowingly.
keda:
  redis:
    # The topology the app's URL declares — standalone, sentinel or cluster —
    # which picks KEDA's scaler: redis-streams, redis-sentinel-streams or
    # redis-cluster-streams.
    topology: standalone
    # standalone: the server's host:port.
    address: ""
    # sentinel and cluster: every host the URL names, comma-separated host:port.
    addresses: ""
    # sentinel: the URL's sentinelServiceName.
    sentinelMaster: ""
    # Names of env vars on the worker pod holding the credentials of KEDA's
    # user — the rule the queue's docs prescribe — and, under Sentinel, of its
    # user on the sentinels, if any.
    usernameFromEnv: ""
    passwordFromEnv: ""
    sentinelUsernameFromEnv: ""
    sentinelPasswordFromEnv: ""
    enableTLS: true
    # The database of the URL's path. KEDA's cluster scaler reads database 0
    # alone, so on a Cluster it stays 0.
    databaseIndex: 0

# --- helm test ----------------------------------------------------------------
# The runtime image is distroless: no shell, no curl. `helm test` therefore
# brings its own client image to hit /health/ready.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.19.0"
    pullPolicy: IfNotPresent
