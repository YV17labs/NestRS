# What the framework's dependency tree may hold: no known vulnerability or
# unsound or unmaintained crate, no licence outside this list, nothing outside
# crates.io. `just lint` runs it; `demo/` and `bench/` are separate projects.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "async-graphql 7.2.1 reaches LruCache::pop only through its dataloader cache factory and persisted-queries store, which nestrs never builds; fixed in async-graphql 8, still a release candidate" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained, not vulnerable; poem's TLS listener parses PEM through it and no poem release drops it" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# MPL-2.0 binds the files it covers, not the crates linking them, so it is
# accepted crate by crate rather than for any dependency that turns up with it.
exceptions = [
    { crate = "ascii_utils", allow = ["MPL-2.0"] },
    { crate = "fast_chemail", allow = ["MPL-2.0"] },
    { crate = "sse-codec", allow = ["MPL-2.0"] },
]
unused-allowed-license = "deny"
unused-license-exception = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
