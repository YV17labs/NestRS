# cargo-deny policy for every lockfile the repo owns — the framework's, the
# demo's and the benchmark SUT's. CI runs it over all three:
#
#   cargo deny --manifest-path <manifest> check --config deny.toml
#
# The `graph` is every feature, so an optional dependency a capability pulls is
# checked whether or not a default build compiles it.

[graph]
all-features = true

[advisories]
# An unmaintained or unsound crate fails the check like a vulnerability does:
# each one is either replaced or ignored below with the reason it cannot reach
# a nestrs path. Revisit every ignore on each dependency bump.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # Marvin Attack: a timing side-channel in RSA PKCS#1 v1.5 *decryption*,
    # pulled in by `jsonwebtoken` (rust_crypto backend) through `rsa`. nestrs
    # signs and verifies JWTs with HS256 and EdDSA only, never RS*, and JWT
    # verification never decrypts with RSA, so the vulnerable path is never
    # invoked. No fixed `rsa` release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "rsa decryption is never invoked: nestrs JWTs are HS256/EdDSA only, and no fixed rsa release exists" },
    # `rustls-pemfile` is unmaintained; its functionality moved into
    # `rustls-pki-types` upstream. Transitive through the TLS stack, parsing
    # PEM at build or boot time, never attacker-controlled input at runtime.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitive through the TLS stack and parses no attacker-controlled input" },
    # `lru` 0.16 is unsound: `LruCache::pop` leaves a dangling node when a
    # key's `Drop` panics. Pulled in by `async-graphql` =7.2.1 (its `dataloader`
    # feature), which reaches `pop` only through its `dataloader::LruCache`
    # factory and its Apollo persisted-queries store. `#[dataloader]` builds
    # `DataLoader::new`, which is `NoCache`, and nestrs registers no
    # persisted-queries extension, so no nestrs path constructs an `LruCache`.
    # Fixed in `lru` >= 0.18.2, which only async-graphql 8 (still a release
    # candidate) depends on: revisit with that bump.
    { id = "RUSTSEC-2026-0253", reason = "no nestrs path constructs async-graphql's LruCache; the fix needs async-graphql 8" },
]

[licenses]
# Every license an expression in the three trees resolves to. A dependency
# under anything else fails the check until it is argued here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft (ascii_utils, fast_chemail, sse-codec): linking is
    # unaffected, and a modified MPL file would have to be published.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The demo's apps and the benchmark SUT are `publish = false` and carry no
# license field.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# An intra-workspace dev-dependency is path-only by rule (no version), so
# cargo strips it from the published manifest.
allow-wildcard-paths = true

[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"
# The same path-only dev-dependency would otherwise count as a duplicate of
# the `[workspace.dependencies]` entry it deliberately does not use.
include-path-dependencies = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
