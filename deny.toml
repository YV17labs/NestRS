# What the framework's dependency tree may hold: no known vulnerability or
# unsound or unmaintained crate, no licence outside this list, nothing outside
# crates.io, and no crate denied below. `just lint` checks the bans, licences and
# sources, which only a change to the tree can break; `just audit` checks the
# advisories, which the database can break overnight. `demo/` and `bench/` are
# separate projects.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "async-graphql 7.2.1 reaches LruCache::pop only through its dataloader cache factory and persisted-queries store, which nestrs never builds; fixed in async-graphql 8, still a release candidate" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# MPL-2.0 binds the files it covers, not the crates linking them, so it is
# accepted crate by crate rather than for any dependency that turns up with it.
exceptions = [
    { crate = "sse-codec", allow = ["MPL-2.0"] },
]
unused-allowed-license = "deny"
unused-license-exception = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Two majors of one crate (syn 1 and 2, thiserror 1 and 2) are the ecosystem's
# pace, not a security or licence matter, so the bans check polices what is
# denied below and does not warn on duplicates.
multiple-versions = "allow"
deny = [
    { crate = "ring", reason = "one crypto provider: rustls, jsonwebtoken and object_store run on aws-lc-rs, and a second compiles twice the cryptography (sea-orm's `runtime-tokio-rustls` and reqwest 0.12's `rustls-tls` bring it back)" },
]
