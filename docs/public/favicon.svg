<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NestRS">
<defs>
  <linearGradient id="rs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff4d5f"/>
    <stop offset="100%" stop-color="#ff7a59"/>
  </linearGradient>
</defs>
<!-- The reduced mark: the `RS` and its two bars, and nothing else — the half a
     16px tab can still read. The trailing bar carries a little more of the
     brand's orange here than in the lockup, where the wordmark holds the eye. -->
<rect width="64" height="64" rx="14" fill="#121114"/>
<text x="4.9" y="36.0" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" font-style="italic" letter-spacing="-0.96" fill="url(#rs-grad)">RS</text>
<g transform="translate(26.2,46.4)"><rect x="-18.0" y="-2.0" width="36.1" height="4.1" rx="2.0" fill="url(#rs-grad)" transform="skewX(-18)"/></g>
<g transform="translate(54.1,46.4)"><rect x="-4.9" y="-2.0" width="9.9" height="4.1" rx="2.0" fill="#ff7a59" opacity="0.55" transform="skewX(-18)"/></g>
</svg>
